            const thumbnailCanvas = document.createElement('canvas');
            thumbnailCanvas.width = 180; thumbnailCanvas.height = 100;
            const tempCtx = thumbnailCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 180, 100);
            const thumbnailDataUrl = thumbnailCanvas.toDataURL('image/png');

            const gameState = {
                player, camera, worldBlocks, columnSurfaceHeights, soilPatchCenters,
                inventory, hotbarItems, selectedHotbarSlot, maintainBlockDurability,
                name: saveName || `Game Save ${new Date().toLocaleString()}`,
                timestamp: Date.now(), thumbnail: thumbnailDataUrl,
                seed: currentSeed,
                craftingGridSlots // Save the crafting grid state
            };
            try {
                localStorage.setItem(SAVE_PREFIX + saveId, JSON.stringify(gameState));
                loadSaveSlots();
                await showMessageBox("Game saved successfully!");
            } catch (e) { 
                console.error("Failed to save game:", e);
                await showMessageBox("Failed to save game. Local storage might be full or an error occurred."); 
            }
        });

        loadButton.addEventListener('click', async () => {
            if (selectedSaveSlotId) {
                try {
                    const savedData = JSON.parse(localStorage.getItem(SAVE_PREFIX + selectedSaveSlotId));
                    if (savedData) {
                        Object.assign(player, savedData.player);
                        Object.assign(camera, savedData.camera);
                        Object.keys(worldBlocks).forEach(key => delete worldBlocks[key]);
                        Object.assign(worldBlocks, savedData.worldBlocks);
                        Object.keys(columnSurfaceHeights).forEach(key => delete columnSurfaceHeights[key]);
                        Object.assign(columnSurfaceHeights, savedData.columnSurfaceHeights);
                        soilPatchCenters.length = 0;
                        soilPatchCenters.push(...savedData.soilPatchCenters);
                        Object.keys(inventory).forEach(key => delete inventory[key]);
                        Object.assign(inventory, savedData.inventory);
                        
                        hotbarItems.length = 0;
                        hotbarItems.push(...(savedData.hotbarItems || new Array(hotbarSize).fill(null)));
                        
                        selectedHotbarSlot = savedData.selectedHotbarSlot;
                        maintainBlockDurability = savedData.maintainDurability || false;

                        currentSeed = savedData.seed || Date.now();
                        setSeed(currentSeed);
                        seedInput.value = currentSeed;

                        // Load crafting grid slots
                        craftingGridSlots.length = 0;
                        craftingGridSlots.push(...(savedData.craftingGridSlots || new Array(16).fill(null)));

                        updateHotbar();
                        toggleSaveMenu();
                        resolvePlayerVerticalCollision();
                        await showMessageBox(`Game loaded: ${savedData.name}`);
                    }
                } catch (e) { 
                    console.error("Failed to load game:", e);
                    await showMessageBox("Failed to load game. Data might be corrupted."); 
                }
            }
        });

        deleteButton.addEventListener('click', async () => {
            if (selectedSaveSlotId) {
                const confirmed = await showMessageBox("Are you sure you want to delete this save?", 'confirm');
                if (confirmed) {
                    try {
                        localStorage.removeItem(SAVE_PREFIX + selectedSaveSlotId);
                        selectedSaveSlotId = null;
                        saveNameInput.value = '';
                        loadSaveSlots();
                        showMessageBox("Save deleted successfully!");
                    } catch (e) {
                        console.error("Failed to delete save:", e);
                        showMessageBox("Failed to delete save.");
                    }
                }
            }
        });

        newGameButton.addEventListener('click', async () => {
            const confirmed = await showMessageBox("Starting a new game will overwrite current progress. Are you sure?", 'confirm');
            if (!confirmed) return;

            let newSeedValue = seedInput.value.trim();
            let seedToUse;

            if (newSeedValue === '') {
                seedToUse = Date.now();
            } else {
                let hash = 0;
                for (let i = 0; i < newSeedValue.length; i++) {
                    const char = newSeedValue.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash |= 0;
                }
                seedToUse = hash;
            }

            setSeed(seedToUse);

            Object.keys(worldBlocks).forEach(key => delete worldBlocks[key]);
            Object.keys(columnSurfaceHeights).forEach(key => delete columnSurfaceHeights[key]);
            soilPatchCenters.length = 0;
            player.x = 10 * tileSize;
            player.y = 0;
            player.dx = 0;
            player.dy = 0;
            player.onGround = false;

            Object.keys(inventory).forEach(key => delete inventory[key]);
            hotbarItems.fill(null);
            selectedHotbarSlot = 0;
            craftingGridSlots.fill(null); // Reset crafting grid for new game
            updateHotbar();

            init();

            toggleSaveMenu();
            showMessageBox(`New game started with seed: ${seedToUse}`);
        });


        resumeButton.addEventListener('click', toggleSaveMenu);

        function resolvePlayerVerticalCollision() {
            const playerCol = Math.floor(player.x / tileSize);
            const playerRow = Math.floor(player.y / tileSize);
            player.onGround = false;
            for (let r = playerRow; r < playerRow + playerHeightBlocks + 2; r++) {
                for (let c = playerCol; c < playerCol + playerWidthBlocks; c++) {
                    if (isSolid(c, r)) {
                        player.y = r * tileSize - playerHeight;
                        player.dy = 0;
                        player.onGround = true;
                        return;
                    }
                }
            }
        }

        let lastTime = 0;
        function gameLoop(currentTime) {
            const dt = currentTime - lastTime;
            lastTime = currentTime;
            if (isGameActive && !isGamePaused) {
                update(dt);
                updatePlantGrowth(dt);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            updatePlayer(dt);
            updateCamera();
            updateMining(dt);
            handleBlockPlacement();
            const playerGridCoords = worldToGrid(player.x + playerWidth / 2, player.y + playerHeight / 2);
            coordsDisplay.textContent = `Coords: (${playerGridCoords.col}, ${playerGridCoords.row})`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawWorld();
            drawPlayer();
            drawMiningProgress();
        }

        function init() {
            resizeCanvas();
            setSeed(currentSeed); 

            const playerStartCol = Math.floor(player.x / tileSize);
            const initialPatchGenerationRange = 200;
            const startPatchCol = playerStartCol - initialPatchGenerationRange / 2;
            for (let i = 0; i < maxSoilPatchCenters; i++) {
                const patchCol = startPatchCol + Math.floor(random() * initialPatchGenerationRange);
                const estimatedSurfaceHeight = baseSurfaceLevel + Math.floor(surfaceLevelRange / 2);
                const patchRow = estimatedSurfaceHeight + Math.floor(Math.random() * soilPatchDepth);
                soilPatchCenters.push({ col: patchCol, row: patchRow });
            }
            let actualSurfaceRowAtStart = baseSurfaceLevel;
            while(getBlockType(playerStartCol, actualSurfaceRowAtStart) === 'sky') {
                 actualSurfaceRowAtStart++;
            }
            player.y = (actualSurfaceRowAtStart - playerHeightBlocks) * tileSize;
            resolvePlayerVerticalCollision();
            updateHotbar();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        loadAssets();
    </script>
</body>
</html>
