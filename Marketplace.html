<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGU Ultimate Marketplace</title>
    <link rel="icon" type="image/png" href="Trailer.png">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-hover: #252525;
            --accent: #00dc82;
            --accent-glow: rgba(0, 220, 130, 0.2);
            --text-main: #eeeeee;
            --text-dim: #999999;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            line-height: 1.5;
        }

        /* --- Header --- */
        header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .logo-area:hover { opacity: 0.8; }
        .logo-area img { width: 35px; height: 35px; border-radius: 6px; }

        .search-bar { flex-grow: 0.4; }
        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #111;
            color: white;
            transition: var(--transition);
        }
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            outline: none;
        }

        /* --- Filters --- */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding: 0 5%;
        }

        .filter-btn {
            background: #222;
            border: 1px solid #333;
            color: var(--text-dim);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .filter-btn:hover { border-color: #555; color: white; }
        .filter-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* --- Grid & Cards --- */
        .container { max-width: 1300px; margin: 2rem auto; padding: 0 20px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .mod-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            transition: var(--transition);
            border: 1px solid #2a2a2a;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mod-card:hover {
            background: var(--bg-hover);
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .mod-logo-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 10px;
            background: #111;
        }

        .mod-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mod-info-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0; }
        .mod-info-author { color: var(--accent); font-size: 0.85rem; font-weight: 500; }
        .mod-tag {
            background: #333;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
            text-transform: uppercase;
        }

        /* --- Details View --- */
        #mod-details { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .details-layout { display: grid; grid-template-columns: 300px 1fr; gap: 40px; }
        .details-sidebar img { width: 100%; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        .download-btn {
            display: block;
            background: var(--accent);
            color: #000;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.2s;
        }

        .download-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        footer { text-align: center; padding: 60px; color: #555; border-top: 1px solid #222; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="logo-area" onclick="showHome()">
        <img src="Trailer.png" alt="Logo" onerror="this.src='https://via.placeholder.com/40'">
        <h2 style="margin: 0; font-size: 1.4rem;">BGU Marketplace</h2>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search mods, authors, or descriptions..." onkeyup="handleSearch()">
    </div>
</header>

<div class="container">
    <div id="home-view">
        <div class="filter-container" id="filter-bar">
            </div>
        <h2 id="view-title" style="margin-bottom: 25px; font-weight: 400; color: var(--text-dim);">Featured Mods</h2>
        <div class="grid" id="mods-grid"></div>
    </div>

    <div id="mod-details">
        <button class="back-btn" onclick="showHome()">← Back to Marketplace</button>
        <div id="details-content"></div>
    </div>
</div>

<footer>
    &copy; 2026 Block Game Ultimate Marketplace • Built for the community.
</footer>

<script>
    const mods = [
        {
            id: 1,
            title: "IntenseCraft (Work In Progress)",
            author: "BGU Dev Team",
            description: "Experience the game like never before with all new intensity. Punching down stone and wood is no longer a simple task. Collect grass and flint and sticks and other resources to build tools, and find curious altars and structures along the way.",
            logo: "Marketplace/IntenseCraft.png",
            gallery: ["Marketplace/IntenseCraft 1.png", "Marketplace/IntenseCraft 2.png"],
            fileUrl: "Marketplace/IntenseCraft.zip",
            category: "Overhaul",
            version: "v1.0.0"
        },
        {
            id: 2,
            title: "Block Game Minecraft (Work In Progress)",
            author: "BGU Dev Team",
            description: "Do you prefer 2D Minecraft over Block Game Ultimate? If so, this is the place for you! Block textures are changed to match Minecraft, and its style. Recipes are changed to use Minecraft's 3x3 grid. Everything is more like Minecraft, with many renames too!",
            logo: "Marketplace/Block Game Minecraft.png",
            gallery: ["Marketplace/Block Game Minecraft 1.png"],
            fileUrl: "Marketplace/Block Game Minecraft.zip",
            category: "Overhaul",
            version: "v1.0.0"
        },
		{
            id: 3,
            title: "Cherry World",
            author: "BGU Dev Team",
            description: "Do you like cherry blossom trees. How about having EVERY tree be a cherry blossom tree. If so, Cherry World is made for you!",
            logo: "Marketplace/Cherry World.png",
            gallery: [],
            fileUrl: "Marketplace/Cherry World.bgumod",
            category: "Overhaul",
            version: "v1.0.0"
        },
        {
            id: 4,
            title: "Parkour Map",
            author: "BGU Dev Team",
            description: "Hardest and first Block Game Ultimate parkour map. Don't risk even the smallest falls, if they are avoidable. Go fast, FAST, FAST!!! Can you beat Bryant's time: 14.90",
            logo: "Marketplace/Parkour Map.png",
            gallery: [],
            fileUrl: "Marketplace/Parkour Map.bgu2",
            category: "World",
            version: "v1.0.0"
        },
		{
            id: 5,
            title: "Chat's Glass UI",
            author: "ChatGPT",
            description: "Gives the UI a full glassmorphic effect. Created fully by ChatGPT. Has some buggy spots.",
            logo: "Marketplace/Chat's Glass UI.png",
            gallery: [],
            fileUrl: "Marketplace/Chat's Glass UI.bgumod",
            category: "User Interface",
            version: "v1.0.0"
        },
		{
            id: 6,
            title: "More Tools!",
            author: "RAZOR Studios",
            description: "Current list of new tools: Stone pickaxe.",
            logo: "Marketplace/More Tools!.png",
            gallery: [],
            fileUrl: "Marketplace/More Tools!.zip",
            category: "Overhaul",
            version: "v1.0.0"
        },
		{
            id: 7,
            title: "The Singularity",
            author: "BGU Dev Team",
            description: "The first ever scripted BGU mod. It will bring an ever growing world breaking black hole to your world (eventually it will destroy the world's state).",
            logo: "Marketplace/The Singularity.png",
            gallery: [],
            fileUrl: "Marketplace/The Singularity.zip",
            category: "Script",
            version: "v1.0.0"
        },
		{
            id: 8,
            title: "Pick Your Fonts!",
            author: "BGU Dev Team",
            description: "Pick between 100+ fonts instead of the basic browser fonts!",
            logo: "Marketplace/Pick Your Fonts!.png",
            gallery: [],
            fileUrl: "Marketplace/Pick Your Fonts!.zip",
            category: "Script",
            version: "v1.0.0"
        },
		{
            id: 9,
            title: "Origin World",
            author: "BGU Dev Team",
            description: "Adds the new origin plateau biome to your world with new blocks and legendary orichalcum! It is the first ever biome adding mod, using scripts!",
            logo: "Marketplace/Origin World.png",
            gallery: ["Marketplace/Origin World 1.png"],
            fileUrl: "Marketplace/Origin World.zip",
            category: "Scripted Overhaul",
            version: "v1.0.0"
        },
		{
            id: 10,
            title: "Nifty Creator Man",
            author: "BGU Dev Team",
            description: "More features coming soon! Currently it has the package to add paintings/photos into item frames using 'y' to upload, and fit to almost any ratio (large sizes limited).",
            logo: "Marketplace/Nifty Creator Man.png",
            gallery: ["Marketplace/Nifty Creator Man 1.png"],
            fileUrl: "Marketplace/Nifty Creator Man.zip",
            category: "Script",
            version: "v1.0.0"
        },
		{
            id: 11,
            title: "Example - Biome Replacements",
            author: "BGU Examples",
            description: "Reference this mod to replace blocks in surface and underworld biomes through modding!.",
            logo: "Marketplace/Examples/Example - Biome Replacements.png",
            gallery: [],
            fileUrl: "Marketplace/Examples/Example - Biome Replacements.bgumod",
            category: "Overhaul",
            version: "v1.0.0"
        },
		{
            id: 12,
            title: "Example - Adding Bombs And Explosives",
            author: "BGU Examples",
            description: "Reference this mod to add new bombs and explosives to BGU through modding!.",
            logo: "Marketplace/Examples/Example - Adding Bombs And Explosives.png",
            gallery: [],
            fileUrl: "Marketplace/Examples/Example - Adding Bombs And Explosives.bgumod",
            category: "Overhaul",
            version: "v1.0.0"
        }
    ];

    let currentCategory = 'All';
    let searchQuery = '';

    // Initialize
    window.onload = () => {
        createFilterButtons();
        renderMods();
    };

    function createFilterButtons() {
        const filterBar = document.getElementById('filter-bar');
        const categories = ['All', ...new Set(mods.map(m => m.category))];
        
        filterBar.innerHTML = categories.map(cat => `
            <button class="filter-btn ${cat === 'All' ? 'active' : ''}" 
                    onclick="filterCategory('${cat}', this)">
                ${cat}
            </button>
        `).join('');
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMods();
    }

    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value.toLowerCase();
        renderMods();
    }

    function renderMods() {
        const grid = document.getElementById('mods-grid');
        const filtered = mods.filter(m => {
            const matchesCat = currentCategory === 'All' || m.category === currentCategory;
            const matchesSearch = m.title.toLowerCase().includes(searchQuery) || 
                                m.description.toLowerCase().includes(searchQuery) ||
                                m.author.toLowerCase().includes(searchQuery);
            return matchesCat && matchesSearch;
        });

        grid.innerHTML = filtered.map(mod => `
            <div class="mod-card" onclick="openMod(${mod.id})">
                <div class="mod-logo-container">
                    <img src="${mod.logo}" onerror="this.src='https://via.placeholder.com/300x300?text=${mod.title}'">
                </div>
                <div class="mod-tag">${mod.category}</div>
                <div class="mod-info-title">${mod.title}</div>
                <div class="mod-info-author">by ${mod.author}</div>
            </div>
        `).join('');
    }

    function openMod(id) {
        const mod = mods.find(m => m.id === id);
        const detailsView = document.getElementById('mod-details');
        const detailsContent = document.getElementById('details-content');

        detailsContent.innerHTML = `
            <div class="details-layout">
                <div class="details-sidebar">
                    <img src="${mod.logo}" onerror="this.src='https://via.placeholder.com/300'">
                    <a href="${mod.fileUrl}" class="download-btn" download>Download Package</a>
                    <div style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem;">
                        <p><strong>Version:</strong> ${mod.version}</p>
                        <p><strong>Category:</strong> ${mod.category}</p>
                    </div>
                </div>
                <div class="details-main">
                    <h1 style="font-size: 2.5rem; margin-top: 0;">${mod.title}</h1>
                    <p class="mod-info-author" style="font-size: 1.1rem;">Created by ${mod.author}</p>
                    <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">
                    <h3>Description</h3>
                    <p style="font-size: 1.1rem; line-height: 1.8; color: #ccc;">${mod.description}</p>
                    
                    ${mod.gallery.length > 0 ? `
                        <h3>Gallery</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            ${mod.gallery.map(img => `<img src="${img}" style="width:100%; border-radius: 10px; border: 1px solid #333;">`).join('')}
                        </div>
                    ` : ''}

                    <div style="margin-top: 40px; padding: 25px; background: #111; border-radius: 12px; border: 1px solid #222;">
                        <h3>Installation Guide</h3>
                        <ol style="color: #bbb; padding-left: 20px;">
                            <li>Download the mod file using the button on the left.</li>
                            <li>Launch Block Game Ultimate.</li>
                            <li>Press 'G' in the main menu to open the Mod Loader.</li>
                            <li>Select the downloaded file to initialize.</li>
                        </ol>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('home-view').style.display = 'none';
        detailsView.style.display = 'block';
        window.scrollTo(0,0);
    }

    function showHome() {
        document.getElementById('mod-details').style.display = 'none';
        document.getElementById('home-view').style.display = 'block';
    }
</script>

</body>
</html>
