        }

        // Creates a single inventory slot HTML element
        function createInventorySlot(itemObject, slotIndex) {
            const slot = document.createElement('div');
            slot.classList.add('inventory-slot');
            
            // Highlight the slot if it contains the item currently held by the cursor
            if (heldItemSourceSlotIndex === slotIndex) {
                slot.classList.add('held-item-source');
            }

            if (itemObject && itemObject.type && itemObject.count > 0) {
                const itemProps = blockTypes[itemObject.type] || itemTypes[itemObject.type];
                const itemImg = assets[itemObject.type];
                // Display image or fallback color
                if (itemImg && !failedAssets[itemObject.type]) {
                    const imgElement = document.createElement('img');
                    imgElement.src = itemImg.src;
                    imgElement.alt = itemObject.type;
                    slot.appendChild(imgElement);
                } else if (itemProps?.color) {
                    const fallbackDiv = document.createElement('div');
                    fallbackDiv.classList.add('fallback');
                    fallbackDiv.style.backgroundColor = itemProps.color;
                    fallbackDiv.textContent = itemObject.type.substring(0, 3).toUpperCase(); // Show first 3 letters
                    slot.appendChild(fallbackDiv);
                }
                const countSpan = document.createElement('span');
                countSpan.classList.add('item-count');
                countSpan.textContent = itemObject.count;
                slot.appendChild(countSpan);

                // Add durability bar for tools
                if (itemProps?.isTool && itemObject.durability !== null && itemObject.durability !== undefined) {
                    const durabilityBar = document.createElement('div');
                    durabilityBar.classList.add('durability-bar');
                    const durabilityFill = document.createElement('div');
                    durabilityFill.classList.add('durability-fill');
                    const durabilityRatio = itemObject.durability / itemProps.maxDurability;
                    durabilityFill.style.width = `${Math.max(0, durabilityRatio * 100)}%`; // Ensure it doesn't go below 0%
                    // Change color based on durability
                    if (durabilityRatio > 0.6) {
                        durabilityFill.style.backgroundColor = '#28a745'; // Green
                    } else if (durabilityRatio > 0.3) {
                        durabilityFill.style.backgroundColor = '#ffc107'; // Yellow
                    } else {
                        durabilityFill.style.backgroundColor = '#dc3545'; // Red
                    }
                    durabilityBar.appendChild(durabilityFill);
                    slot.appendChild(durabilityBar);
                }
            }
            return slot;
        }

        // Handles clicks on inventory and hotbar slots within the inventory menu
        function handleInventorySlotClick(slotIndex, event) {
            event.preventDefault(); // Prevent default right-click context menu

            const clickedSlotItem = inventorySlots[slotIndex];
            const clickedItemProps = clickedSlotItem ? (itemTypes[clickedSlotItem.type] || blockTypes[clickedSlotItem.type]) : null;

            if (event.button === 2) { // Right-click (split stack / place one)
                if (heldItem === null) {
                    // PICKING UP HALF A STACK
                    if (clickedSlotItem && clickedSlotItem.count > 1) {
                        const halfCount = Math.ceil(clickedSlotItem.count / 2);
                        heldItem = { ...clickedSlotItem, count: halfCount }; // Create a new object for held item
                        clickedSlotItem.count -= halfCount;
                        if (clickedSlotItem.count <= 0) {
                            inventorySlots[slotIndex] = null;
                            const hotbarIdx = hotbarIndices.indexOf(slotIndex);
                            if (hotbarIdx !== -1) hotbarIndices[hotbarIdx] = null;
                        }
                        heldItemSourceSlotIndex = slotIndex;
                    }
                } else {
                    // PLACING ONE ITEM AT A TIME
                    const heldItemProps = itemTypes[heldItem.type] || blockTypes[heldItem.type];
                    if (heldItem.count > 0) {
                        if (clickedSlotItem === null) {
                            // Place one into empty slot
                            inventorySlots[slotIndex] = { type: heldItem.type, count: 1, durability: heldItem.durability };
                            heldItem.count--;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        } else if (clickedSlotItem.type === heldItem.type && !heldItemProps?.isTool && clickedSlotItem.count < maxStackSize) {
                            // Stack one with existing non-tool item
                            clickedSlotItem.count++;
                            heldItem.count--;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        }
                        // If it's a tool or different item type, right-click place does nothing (cannot split tools, cannot place different items)
                    }
                }
            } else { // Left-click (pick up full stack or swap)
                if (heldItem === null) {
                    // PICKING UP AN ITEM
                    if (clickedSlotItem) {
                        heldItem = inventorySlots[slotIndex]; // Hold the actual item object
                        inventorySlots[slotIndex] = null; // Clear the slot
                        heldItemSourceSlotIndex = slotIndex;
                        const hotbarIdx = hotbarIndices.indexOf(slotIndex);
                        if (hotbarIdx !== -1) hotbarIndices[hotbarIdx] = null; // Clear hotbar reference if it was a hotbar slot
                    }
                } else {
                    // PLACING OR SWAPPING AN ITEM
                    const heldItemProps = itemTypes[heldItem.type] || blockTypes[heldItem.type];

                    if (clickedSlotItem === null) {
                        // Placing held item into an empty slot
                        inventorySlots[slotIndex] = heldItem;
                        heldItem = null;
                        heldItemSourceSlotIndex = -1;
                        // If this empty slot is also a hotbar slot, assign its index
                        if (slotIndex < hotbarSize && hotbarIndices[slotIndex] === null) {
                            hotbarIndices[slotIndex] = slotIndex;
                        }
                    } else if (clickedSlotItem.type === heldItem.type) {
                        // Stacking with existing item of same type (only for non-tools)
                        if (!heldItemProps?.isTool && clickedSlotItem.count < maxStackSize) { // Only stack non-tools
                            const amountToTransfer = Math.min(heldItem.count, maxStackSize - clickedSlotItem.count);
                            clickedSlotItem.count += amountToTransfer;
                            heldItem.count -= amountToTransfer;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        } else {
                            // Cannot stack tools or full stacks, swap them
                            const tempHeldItem = heldItem;
                            heldItem = inventorySlots[slotIndex];
                            inventorySlots[slotIndex] = tempHeldItem;
                            // If this slot is a hotbar slot, update its index
                            if (slotIndex < hotbarSize) {
                                hotbarIndices[slotIndex] = slotIndex;
                            }
                        }
                    } else {
                        // Swapping items (different types)
                        const tempHeldItem = heldItem;
                        heldItem = inventorySlots[slotIndex];
                        inventorySlots[slotIndex] = tempHeldItem;
                        // If this slot is a hotbar slot, update its index
                        if (slotIndex < hotbarSize) {
                            hotbarIndices[slotIndex] = slotIndex;
                        }
                    }
                }
            }
            updateInventoryMenu(); // Refresh inventory display
            updateHotbar(); // Refresh hotbar display
        }

        // Handles clicks on crafting grid slots
        function handleCraftingSlotClick(craftingSlotIndex, event) {
            event.preventDefault(); // Prevent default right-click context menu

            const clickedSlotItem = craftingGridSlots[craftingSlotIndex];
            const clickedItemProps = clickedSlotItem ? (itemTypes[clickedSlotItem.type] || blockTypes[clickedSlotItem.type]) : null;

                            craftingGridSlots[craftingSlotIndex] = null;

                        heldItemSourceSlotIndex = `crafting-${craftingSlotIndex}`; // Mark source for crafting grid
                    }
                } else {
                    // PLACING ONE ITEM AT A TIME INTO CRAFTING GRID
                    const heldItemProps = itemTypes[heldItem.type] || blockTypes[heldItem.type];
                    if (heldItem.count > 0) {
                        if (clickedSlotItem === null) {
                            // Place one into empty slot
                            craftingGridSlots[craftingSlotIndex] = { type: heldItem.type, count: 1, durability: heldItem.durability };
                            heldItem.count--;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        } else if (clickedSlotItem.type === heldItem.type && !heldItemProps?.isTool && clickedSlotItem.count < maxStackSize) {
                            // Stack one with existing non-tool item
                            clickedSlotItem.count++;
                            heldItem.count--;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        }
                    }
                }
            } else { // Left-click (pick up full stack or swap)
                if (heldItem === null) {
                    // PICKING UP FROM CRAFTING GRID
                    if (clickedSlotItem) {
                        heldItem = craftingGridSlots[craftingSlotIndex];
                        craftingGridSlots[craftingSlotIndex] = null;
                        heldItemSourceSlotIndex = `crafting-${craftingSlotIndex}`; // Mark source for crafting grid
                    }
                } else {
                    // PLACING OR SWAPPING INTO CRAFTING GRID
                    const heldItemProps = itemTypes[heldItem.type] || blockTypes[heldItem.type];

                    if (clickedSlotItem === null) {
                        // Place into empty slot
                        craftingGridSlots[craftingSlotIndex] = heldItem;
                        heldItem = null;
                        heldItemSourceSlotIndex = -1;
                    } else if (clickedSlotItem.type === heldItem.type) {
                        // Stacking with existing item (only for non-tools)
                        if (!heldItemProps?.isTool && clickedSlotItem.count < maxStackSize) {
                            const amountToTransfer = Math.min(heldItem.count, maxStackSize - clickedSlotItem.count);
                            clickedSlotItem.count += amountToTransfer;
                            heldItem.count -= amountToTransfer;
                            if (heldItem.count <= 0) {
                                heldItem = null;
                                heldItemSourceSlotIndex = -1;
                            }
                        } else {
                            // Cannot stack tools or full stacks, swap them
                            const tempHeldItem = heldItem;
                            heldItem = craftingGridSlots[craftingSlotIndex];
                            craftingGridSlots[craftingSlotIndex] = tempHeldItem;
                        }
                    } else {
                        // Swap items
                        const tempHeldItem = heldItem;
                        heldItem = craftingGridSlots[craftingSlotIndex];
                        craftingGridSlots[craftingSlotIndex] = tempHeldItem;
                    }
                }
            }
            updateInventoryMenu(); // This will also call checkCraftingRecipe
        }

        // Checks if any recipe matches the current items in the crafting grid
        function checkCraftingRecipe() {
            craftingOutputSlot.innerHTML = ''; // Clear previous output
            craftButton.disabled = true; // Disable craft button by default
            craftButton.onclick = null; // Clear previous click handler

            for (const recipe of recipes) {
                let recipeMatches = true;
                const requiredInput = recipe.input;

                // Check if all required input slots match
                for (let i = 0; i < 16; i++) {
                    const required = requiredInput[i];
                    const current = craftingGridSlots[i];

                    if (required) {
                        if (!current || current.count < required.count) {
                            recipeMatches = false;
                            break;
                        }
                        // Special handling for 'any_plank'
                        if (required.type === 'any_plank') {
                            const currentItemProps = blockTypes[current.type]; // Use current.type
                            if (!currentItemProps || !(current.type.startsWith('planked_') && currentItemProps.solid)) {
                                recipeMatches = false;
                                break;
                            }
                        } else if (current.type !== required.type) { // Use current.type
                            recipeMatches = false;
                            break;
                        }
                    } else if (current) {
                        // If there's an item in the crafting grid but the recipe doesn't require it
                        recipeMatches = false;
                        break;
                    }
                }

                if (recipeMatches) {
                    const outputItemProps = itemTypes[recipe.output] || blockTypes[recipe.output];
                    // Create a visual representation of the craftable output
                    const outputSlotContent = createInventorySlot({
                        type: recipe.output,
                        count: recipe.outputCount,
                        durability: outputItemProps?.isTool ? outputItemProps.maxDurability : null
                    }, -1); // -1 as slotIndex for output
                    craftingOutputSlot.appendChild(outputSlotContent);
                    craftButton.disabled = false; // Enable craft button
                    craftButton.onclick = () => executeCraft(recipe); // Set click handler
                    return; // Found a matching recipe, no need to check others
                }
            }
        }

        // Executes the crafting of a given recipe
        function executeCraft(recipe) {
            // Consume input items from the crafting grid
            for (let i = 0; i < 16; i++) {
                const required = recipe.input[i];
                if (required) {
                    const current = craftingGridSlots[i];
                    current.count -= required.count;
                    if (current.count <= 0) {
                        craftingGridSlots[i] = null; // Clear slot if count drops to 0
                    }
                }
            }

            // Add output to inventory
            const outputItemProps = itemTypes[recipe.output] || blockTypes[recipe.output];
            addToInventory(recipe.output, recipe.outputCount, outputItemProps?.isTool ? outputItemProps.maxDurability : null);
            updateInventoryMenu(); // Refresh inventory and crafting display
        }

        // Renders all available crafting recipes in the recipe list
        function renderRecipes() {
            recipeListDiv.innerHTML = ''; // Clear existing recipes
            for (const recipe of recipes) {
                const recipeItemDiv = document.createElement('div');
                recipeItemDiv.classList.add('recipe-item');

                const inputGridDiv = document.createElement('div');
                inputGridDiv.classList.add('recipe-input-grid');

                // Determine which input to display (default or altInputs for 'any_plank' recipes)
                const displayInput = recipe.altInputs && recipe.altInputs.length > 0 ? recipe.altInputs[0] : recipe.input;

                for (let i = 0; i < 16; i++) {
                    const inputItem = displayInput[i];
                    const slot = createInventorySlot(inputItem ? {type: inputItem.type, count: inputItem.count} : null, -1); // Pass item object
                    inputGridDiv.appendChild(slot);
                }
                recipeItemDiv.appendChild(inputGridDiv);

                const arrowSpan = document.createElement('span');
                arrowSpan.classList.add('crafting-arrow');
                arrowSpan.textContent = '→';
                recipeItemDiv.appendChild(arrowSpan);

                const outputDiv = document.createElement('div');
                outputDiv.classList.add('recipe-output');

                const outputItemProps = itemTypes[recipe.output] || blockTypes[recipe.output];
                const outputSlot = createInventorySlot({
                    type: recipe.output,
                    count: recipe.outputCount,
                    durability: outputItemProps?.isTool ? outputItemProps.maxDurability : null
                }, -1);
                outputDiv.appendChild(outputSlot);
                
                const outputNameSpan = document.createElement('span');
                // Capitalize first letter of each word in the output name
                outputNameSpan.textContent = recipe.name || recipe.output.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                outputDiv.appendChild(outputNameSpan);

                recipeItemDiv.appendChild(outputDiv);
                recipeListDiv.appendChild(recipeItemDiv);
            }
        }

        // Updates the growth state of planted seeds
        function updatePlantGrowth(dt) {
            const currentTime = Date.now();
            for (const key in worldBlocks) {
                const blockData = worldBlocks[key];
                const coords = key.split(',').map(Number);
                const col = coords[0];
                const row = coords[1];

                if (blockData.type === 'planted_seeds') {
                    // Growth time is faster on soil than dirt
                    const growthTimeRequired = blockData.baseBlockType === 'soil' ? 60000 : 120000; // 1 min on soil, 2 min on dirt
                    if (currentTime - blockData.plantTime >= growthTimeRequired) {
                        // Check if the block above is sky (empty space for wheat to grow into)
                        if (getBlockType(col, row - 1) === 'sky') {
                            worldBlocks[`${col},${row - 1}`] = { type: 'wheat', miningProgress: 0 }; // Place wheat block above
                            // Change the planted_seeds block back to its base block type (dirt/soil)
                            blockData.type = blockData.baseBlockType; 
                            delete blockData.plantTime; // Remove plant time property
                            delete blockData.baseBlockType; // Remove base block type property
                        }
                    }
                }
            }
        }

        // Toggles the save/game menu visibility
        function toggleSaveMenu() {
            // Prevent opening save menu if inventory is open (and game is not already paused by save menu)
            if (inventoryCraftingOverlay.style.display === 'flex' && !isGamePaused) return;

            isGamePaused = !isGamePaused; // Toggle game pause state
            if (isGamePaused) {
                saveMenuOverlay.style.display = 'flex'; // Show menu
                seedInput.value = currentSeed; // Display current seed in the input field
                maintainDurabilityCheckbox.checked = maintainBlockDurability; // Set checkbox state
            } else {
                saveMenuOverlay.style.display = 'none'; // Hide menu
                resolvePlayerVerticalCollision(); // Ensure player is on solid ground after resuming
                lastTime = performance.now(); // Reset lastTime to prevent large dt after pausing
            }
        }

        maintainDurabilityCheckbox.addEventListener('change', () => { maintainBlockDurability = maintainDurabilityCheckbox.checked; });

        // Event listener for the "Export Current Game" button
        exportCurrentGameButton.addEventListener('click', async () => {
            // Use seed input for filename or a default timestamped name
            const saveName = seedInput.value.trim() || `BlockGameUltimate_Save_${Date.now()}`;
            const fileName = `${saveName}.bguworld`;
            
            // Create a thumbnail of the current game view
            const thumbnailCanvas = document.createElement('canvas');
            thumbnailCanvas.width = 180; thumbnailCanvas.height = 100;
            const tempCtx = thumbnailCanvas.getContext('2d');
            // Draw the current game canvas onto the thumbnail canvas
            tempCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 180, 100);
            const thumbnailDataUrl = thumbnailCanvas.toDataURL('image/png');

            // Collect all relevant game state data
            const gameState = {
                player, camera, worldBlocks, columnSurfaceHeights, soilPatchCenters,
                inventorySlots, hotbarIndices, selectedHotbarSlot, maintainBlockDurability, // Updated inventory variables
                name: saveName, // Use the provided name
                timestamp: Date.now(), thumbnail: thumbnailDataUrl,
                seed: currentSeed,
                craftingGridSlots,
                heldItem // Save held item state
            };

            let gameStateString;
            try {
                gameStateString = JSON.stringify(gameState); // Convert game state to JSON string
            } catch (e) {
                console.error("Error stringifying game state for export:", e);
                await showMessageBox("Failed to export game. Error preparing data. Check console for details.");
                return;
            }

            try {
                const zip = new JSZip(); // Create a new JSZip instance
                zip.file("savegame.json", gameStateString); // Add game state JSON to zip
                if (gameState.thumbnail) {
                    const base64Data = gameState.thumbnail.split(',')[1]; // Extract base64 data from Data URL
                    zip.file("thumbnail.png", base64Data, { base64: true }); // Add thumbnail to zip
                }

                const content = await zip.generateAsync({ type: "blob" }); // Generate zip file as a Blob

                // Create a download link and trigger download
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href); // Clean up the object URL

                await showMessageBox(`Current game exported as "${fileName}"!`);

            } catch (e) {
                console.error("Error exporting game:", e);
                await showMessageBox("Failed to export game. Check console for details.");
            }
        });

        // Event listener for the "Load from File" button (triggers hidden file input)
        loadFromFileButton.addEventListener('click', () => {

        // Event listener for the "New Game" button
        newGameButton.addEventListener('click', async () => {
            const confirmed = await showMessageBox("Starting a new game will overwrite current progress. Are you sure?", 'confirm');
            if (!confirmed) return; // If user cancels, do nothing

            let newSeedValue = seedInput.value.trim();
            let seedToUse;

            if (newSeedValue === '') {
                seedToUse = Date.now(); // Use current timestamp for random seed
            } else {
                seedToUse = stringToHash(newSeedValue); // Hash the string seed
            }

            setSeed(seedToUse); // Set the new seed

            // Reset all game state variables
            Object.keys(worldBlocks).forEach(key => delete worldBlocks[key]);
            Object.keys(columnSurfaceHeights).forEach(key => delete columnSurfaceHeights[key]);
            soilPatchCenters.length = 0; // Clear soil patch centers
            player.x = 10 * tileSize;
            player.y = 0;
            player.dx = 0;
            player.dy = 0;
            player.onGround = false;

            // Reset inventory for new game
            inventorySlots.fill(null);
            hotbarIndices.fill(null); // Reset hotbar indices
            selectedHotbarSlot = 0;
            playerMiningPower = 0.1; // Reset to base mining power

            craftingGridSlots.fill(null); // Reset crafting grid for new game
            heldItem = null; // Clear held item
            heldItemSourceSlotIndex = -1;

        // Event listener for the "Resume Game" button
        resumeButton.addEventListener('click', toggleSaveMenu);

        // Event listener for file input change (when a .bguworld file is selected)
        importFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) {
                return; // No file selected
            }

            if (!file.name.endsWith('.bguworld')) {
                await showMessageBox("Invalid file type. Please select a .bguworld file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const zip = await JSZip.loadAsync(e.target.result); // Load the zip file
                    const jsonFile = zip.file("savegame.json"); // Get the savegame.json file from the zip

                    if (!jsonFile) {
                        await showMessageBox("Invalid .bguworld file: 'savegame.json' not found inside.");
                        return;
                    }

                    const savedDataString = await jsonFile.async("text"); // Read JSON content as text
                    const savedData = JSON.parse(savedDataString); // Parse JSON string into object

                    // Load the game state from the parsed data
                    Object.assign(player, savedData.player);
                    Object.assign(camera, savedData.camera);
                    
                    // Clear existing world blocks and load saved ones
                    Object.keys(worldBlocks).forEach(key => delete worldBlocks[key]);
                    Object.assign(worldBlocks, savedData.worldBlocks);
                    
                    // Clear existing surface heights and load saved ones
                    Object.keys(columnSurfaceHeights).forEach(key => delete columnSurfaceHeights[key]);
                    Object.assign(columnSurfaceHeights, savedData.columnSurfaceHeights);
                    
                    // Clear and push saved soil patch centers (if any)
                    soilPatchCenters.length = 0;
                    if (savedData.soilPatchCenters) { // Check if it exists in saved data
                        soilPatchCenters.push(...savedData.soilPatchCenters);
                    }
                    
                    // Load inventorySlots
                    inventorySlots.fill(null); // Clear current slots
                    if (savedData.inventorySlots) {
                        for (let i = 0; i < savedData.inventorySlots.length; i++) {
                            const savedSlot = savedData.inventorySlots[i];
                            if (savedSlot) {
                                // Ensure durability is set for tools if it's missing or invalid
                                if (itemTypes[savedSlot.type]?.isTool && (savedSlot.durability === undefined || savedSlot.durability === null || savedSlot.durability <= 0)) {
                                    savedSlot.durability = itemTypes[savedSlot.type].maxDurability;
                                }
                                inventorySlots[i] = savedSlot;
                            }
                        }
                    }
                    
                    // Load hotbarIndices
                    hotbarIndices.fill(null); // Clear current indices
                    if (savedData.hotbarIndices) {
                        hotbarIndices.splice(0, hotbarIndices.length, ...savedData.hotbarIndices);
                    }
                    
                    selectedHotbarSlot = savedData.selectedHotbarSlot;
                    maintainBlockDurability = savedData.maintainBlockDurability || false; // Load checkbox state

                    currentSeed = savedData.seed || Date.now(); // Load seed or default to new timestamp
                    setSeed(currentSeed); // Apply the loaded seed
                    seedInput.value = currentSeed; // Update seed input field

                    // Load crafting grid slots
                    craftingGridSlots.fill(null);
                    if (savedData.craftingGridSlots) {
                        craftingGridSlots.splice(0, craftingGridSlots.length, ...savedData.craftingGridSlots);
                    }
                    
                    // Load held item state
                    heldItem = savedData.heldItem || null;
                    heldItemSourceSlotIndex = -1; // Reset source index on load

                    updateHotbar(); // Refresh hotbar display
                    toggleSaveMenu(); // Close the menu after loading
                    resolvePlayerVerticalCollision(); // Ensure player is on solid ground
                    await showMessageBox(`Game "${savedData.name || 'Unnamed Save'}" loaded from file!`);
                    
                } catch (e) {
                    console.error("Error importing game:", e);
                    await showMessageBox("Failed to import game. The file might be corrupted or not a valid .bguworld save. Check console for details.");
                }
            };
            reader.readAsArrayBuffer(file); // Read the selected file as an ArrayBuffer
        });

        // Resolves player's vertical position to ensure they are on solid ground
        function resolvePlayerVerticalCollision() {
            const playerCol = Math.floor(player.x / tileSize);
            const playerRow = Math.floor(player.y / tileSize);
            player.onGround = false;
            // Check blocks below and around the player to find a solid surface
            for (let r = playerRow; r < playerRow + playerHeightBlocks + 2; r++) {
                for (let c = playerCol; c < playerCol + playerWidthBlocks; c++) {
                    if (isSolid(c, r)) {
                        player.y = r * tileSize - playerHeight; // Adjust player Y to be on top of the block
                        player.dy = 0; // Stop vertical movement
                        player.onGround = true; // Mark as on ground
                        return; // Found ground, exit
                    }
                }
            }
        }

        let lastTime = 0; // Stores the timestamp of the previous frame
        // Main game loop
        function gameLoop(currentTime) {
            const dt = currentTime - lastTime; // Calculate delta time
            lastTime = currentTime; // Update lastTime for next frame
            if (isGameActive && !isGamePaused) { // Only update if game is active and not paused
                update(dt); // Update game logic
                updatePlantGrowth(dt); // Update plant growth
            }
            draw(); // Draw game elements
            requestAnimationFrame(gameLoop); // Request next animation frame
        }

        // Updates game logic (player, camera, mining, placement)
        function update(dt) {
            updatePlayer(dt);
            updateCamera();
            updateMining(dt);
            handleBlockPlacement();
            const playerGridCoords = worldToGrid(player.x + playerWidth / 2, player.y + playerHeight / 2);
            coordsDisplay.textContent = `Coords: (${playerGridCoords.col}, ${playerGridCoords.row})`;
        }

        // Draws all game elements to the canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear entire canvas
            drawWorld(); // Draw blocks
            drawPlayer(); // Draw player
            drawMiningProgress(); // Draw mining overlay
        }

        // Initializes the game
        function init() {
            resizeCanvas(); // Set initial canvas size
            setSeed(currentSeed); // Apply the current seed for world generation

            const playerStartCol = Math.floor(player.x / tileSize);
            // Initial generation of a small area around the player to ensure a starting surface
            const initialGenerationRange = 50; // Generate blocks within this range around player
            for(let c = playerStartCol - initialGenerationRange / 2; c < playerStartCol + initialGenerationRange / 2; c++) {
                // Force generation of blocks in a column to establish surface height
                for(let r = 0; r < baseSurfaceLevel + dirtLayerDepth + stoneLayerDepth + compactingStoneLayerDepth + 5; r++) {
                    getBlockData(c, r); // This will generate the block and update columnSurfaceHeights
                }
            }

            // Find an actual solid surface for the player to start on
            let actualSurfaceRowAtStart = baseSurfaceLevel;
            const maxSurfaceSearchDepth = 200; // Define a reasonable max depth to search for surface
            let searchCount = 0;
            // Search downwards from baseSurfaceLevel until a solid block is found
            while(getBlockType(playerStartCol, actualSurfaceRowAtStart) === 'sky' && searchCount < maxSurfaceSearchDepth) {
                 actualSurfaceRowAtStart++;
                 searchCount++;
            }
            // If surface was not found within max depth, default to a safe starting Y
            if (searchCount >= maxSurfaceSearchDepth) {
                console.warn("Could not find solid surface within search depth. Defaulting player Y position.");
                actualSurfaceRowAtStart = baseSurfaceLevel + dirtLayerDepth + 2; // A safe default below surface
            }

            player.y = (actualSurfaceRowAtStart - playerHeightBlocks) * tileSize; // Position player on the surface
            resolvePlayerVerticalCollision(); // Final check to ensure player is on ground
            updateHotbar(); // Initial hotbar update
            lastTime = performance.now(); // Initialize lastTime for game loop
            requestAnimationFrame(gameLoop); // Start the game loop
        }

        loadAssets(); // Start loading assets when the script runs
    </script>
