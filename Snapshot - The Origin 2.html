<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Layers Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb; /* Set body background to sky blue */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            border: 2px solid #555;
            display: block;
            width: 100%; /* Make canvas fill container width */
            height: 100%; /* Make canvas fill container height */
        }
        #gameContainer {
            position: relative;
            display: inline-block; /* To center the container */
            width: 100vw; /* Ensure game container takes full viewport width */
            height: 100vh; /* Ensure game container takes full viewport height */
            overflow: hidden; /* Hide overflow from canvas scaling */
        }
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 50;
        }
        .hotbar-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .hotbar-slot.selected {
            border-color: yellow;
        }
        .hotbar-slot span {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 10px;
            color: white; /* Ensure count is visible */
            text-shadow: 1px 1px 2px black; /* Add shadow for readability */
        }
        .hotbar-slot img {
             /* Represents the block image */
            width: 30px;
            height: 30px;
            image-rendering: pixelated; /* Optional: for pixel art style */
        }
         /* Style for fallback text/color in hotbar if image fails */
        .hotbar-slot .fallback {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            text-align: center;
            word-break: break-word; /* Prevent long names from overflowing */
            padding: 2px;
            box-sizing: border-box; /* Include padding in element's total width and height */
        }
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 100;
        }
         #coordsDisplay {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 50; /* Ensure it's above the canvas */
        }
        /* Save Menu Styles */
        #saveMenuOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); /* Darker, more opaque overlay */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* On top of everything */
            font-family: 'Inter', sans-serif; /* Use Inter font */
            color: #E0E0E0; /* Light gray text */
            flex-direction: column;
            gap: 20px;
            display: none; /* Hidden by default */
        }

        #saveMenu {
            background-color: #333; /* Darker background for the menu */
            padding: 30px;
            border-radius: 15px; /* More rounded corners */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); /* Stronger shadow */
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 2px solid #555; /* Subtle border */
            max-height: 90vh; /* Make the menu itself scrollable */
            overflow-y: auto; /* Enable vertical scrolling */
        }

        #saveMenu h2 {
            color: #00BFFF; /* Deep sky blue for headings */
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em; /* Larger heading */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Removed #saveSlots, .save-slot, .save-slot-info, .save-slot-name styles as they are no longer used */

        #saveNameInput, #seedInput { /* Apply styles to both inputs */
            width: calc(100% - 20px); /* Adjust for padding */
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #666;
            border-radius: 8px;
            background-color: #555;
            color: white;
            font-size: 1em;
            box-sizing: border-box; /* Include padding in width */
        }

        #saveNameInput::placeholder, #seedInput::placeholder {
            color: #AAA;
        }

        .menu-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-buttons button:hover {
            transform: translateY(-2px);
        }

        /* Removed #saveButton, #loadButton, #deleteButton styles as they are no longer used */

        #resumeButton, #newGameButton { /* Apply to New Game button as well */
            background-color: #6c757d; /* Gray */
            color: white;
        }
        #resumeButton:hover, #newGameButton:hover {
            background-color: #5a6268;
        }

        #loadFromFileButton {
            background-color: #6f42c1; /* Purple */
            color: white;
        }
        #loadFromFileButton:hover {
            background-color: #5a36a3;
        }

        #exportCurrentGameButton {
            background-color: #fd7e14; /* Orange */
            color: white;
        }
        #exportCurrentGameButton:hover {
            background-color: #e06f0e;
        }


        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            #saveMenu {
                padding: 20px;
                width: 95%;
            }
            #saveMenu h2 {
                font-size: 1.5em;
            }
            /* Removed #saveSlots grid-template-columns adjustment as it's no longer used */
            .menu-buttons {
                flex-direction: column;
                gap: 10px;
            }
            .menu-buttons button {
                width: 100%;
            }
        }

        /* Custom Message Box Styles */
        #customMessageBoxOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Higher than save menu */
            font-family: 'Inter', sans-serif;
            color: white;
            display: none; /* Hidden by default */
        }

        #customMessageBox {
            background-color: #444;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 80%;
            border: 1px solid #666;
        }

        #messageBoxText {
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        #messageBoxButtons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        #messageBoxButtons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s ease;
        }

        #messageBoxButtons button:hover {
            background-color: #0056b3;
        }

        #messageBoxCancelButton {
            background-color: #6c757d;
        }
        #messageBoxCancelButton:hover {
            background-color: #5a6268;
        }

        /* Inventory & Crafting Menu Styles */
        #inventoryCraftingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Inter', sans-serif;
            color: #E0E0E0;
        }

        #inventoryCraftingMenu {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 600px;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 90vh; /* Make the menu itself scrollable */
            overflow-y: auto; /* Enable vertical scrolling */
        }

        #inventoryCraftingMenu h2 {
            color: #00BFFF;
            text-align: center;
            margin: 0 0 10px 0;
        }
        
        .inventory-section {
            padding: 10px;
            background-color: #444;
            border-radius: 10px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
        }

        .inventory-slot {
            width: 45px;
            height: 45px;
            border: 2px solid #777;
            background-color: #555;
            border-radius: 5px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .inventory-slot:hover {
            background-color: #666;
        }
        .inventory-slot img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        .inventory-slot .item-count {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }
        /* New style for hotbar slots within the inventory menu */
        #inventoryHotbarGrid .hotbar-slot {
            border-color: yellow; /* Distinguish hotbar slots in inventory */
        }


        .crafting-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #craftingGrid {
            display: grid;
            grid-template-columns: repeat(4, 45px); /* Changed to 4x4 */
            grid-template-rows: repeat(4, 45px); /* Changed to 4x4 */
            gap: 5px;
        }
        
        .crafting-arrow {
            font-size: 2em;
            color: #999;
        }

        #craftingOutput {
            width: 50px;
            height: 50px;
            border: 2px dashed #999;
        }
        
        #craftButton {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            align-self: center;
        }
        #craftButton:disabled {
            background-color: #5a6268;
            cursor: not-allowed;
        }
        /* Removed #heldItemCursor styles as it's no longer used */

        /* Recipe Menu Styles */
        #recipeMenu {
            padding: 10px;
            background-color: #444;
            border-radius: 10px;
            margin-top: 20px;
            /* Removed max-height and overflow-y: auto to allow parent to scroll */
        }

        #recipeMenu h3 {
            color: #00BFFF;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .recipe-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            background-color: #555;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #666;
        }

        .recipe-input-grid {
            display: grid;
            grid-template-columns: repeat(4, 35px); /* Smaller grid for recipe display */
            grid-template-rows: repeat(4, 35px);
            gap: 3px;
            margin-right: 10px;
            flex-shrink: 0; /* Prevent shrinking */
        }

        .recipe-input-grid .inventory-slot {
            width: 35px;
            height: 35px;
            border: 1px solid #777;
            background-color: #666;
        }

        .recipe-output {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .recipe-output .inventory-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #777;
            background-color: #555;
            border-radius: 5px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .recipe-output .inventory-slot img {
            width: 28px;
            height: 28px;
        }
        .recipe-output .inventory-slot .item-count {
            font-size: 10px;
        }

        /* Durability Bar for Pickaxe */
        .durability-bar {
            position: absolute;
            bottom: 0px; /* Position at the bottom of the slot */
            left: 0;
            width: 100%;
            height: 4px; /* Thin bar */
            background-color: #555; /* Background for empty part */
            border-radius: 2px;
            overflow: hidden;
        }

        .durability-fill {
            height: 100%;
            background-color: #28a745; /* Green for full durability */
            width: 100%; /* Default to full width */
            transition: width 0.1s linear; /* Smooth transition for durability changes */
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hotbar">
        </div>
        <div id="loadingScreen">Loading Assets...</div>
        <div id="coordsDisplay">Coords: (0, 0)</div>
    </div>

    <!-- Save Menu Overlay -->
    <div id="saveMenuOverlay" oncontextmenu="return false;">
        <div id="saveMenu">
            <h2>Game Menu</h2>
            <div class="menu-item" style="margin-bottom: 15px;">
                <label for="seedInput" style="display: block; margin-bottom: 5px; color: #CCC; text-align: center;">World Seed (optional):</label>
                <input type="text" id="seedInput" placeholder="Leave empty for random seed" style="width: calc(100% - 20px); padding: 10px; border-radius: 5px; border: 1px solid #555; background-color: #444; color: white;">
            </div>
            <div class="menu-buttons" style="flex-direction: column; gap: 10px;">
                <button id="newGameButton">New Game</button>
                <button id="resumeButton">Resume Game</button>
            </div>
            <hr style="border-color: #555; margin: 20px 0;">
            <div class="menu-item" style="text-align: center;">
                <label for="importFileInput" style="display: block; margin-bottom: 10px; color: #CCC;">Load/Save Game File (.bguworld):</label>
                <input type="file" id="importFileInput" accept=".bguworld" style="display: none;">
                <button id="loadFromFileButton" style="background-color: #6f42c1; color: white; margin-right: 10px;">Load from File</button>
                <button id="exportCurrentGameButton" style="background-color: #fd7e14; color: white;">Export Current Game</button>
            </div>
            <label style="margin-top: 10px; display: flex; align-items: center; justify-content: center;">
                <input type="checkbox" id="maintainDurabilityCheckbox" style="margin-right: 8px;"> Maintain Block Durability
            </label>
        </div>
    </div>

    <!-- Inventory & Crafting Menu Overlay -->
    <div id="inventoryCraftingOverlay" oncontextmenu="return false;">
        <div id="inventoryCraftingMenu">
            <h2>Inventory & Crafting</h2>
            <div class="inventory-section">
                <h3>Crafting</h3>
                <div class="crafting-area">
                    <div id="craftingGrid">
                        <!-- Crafting grid slots will be dynamically generated here -->
                    </div>
                    <div class="crafting-arrow">&#10144;</div>
                    <div class="inventory-slot" id="craftingOutput"></div>
                </div>
                 <button id="craftButton" disabled>Craft</button>
            </div>
            
            <div class="inventory-section">
                <h3>Your Inventory</h3>
                <div id="playerInventoryGrid" class="inventory-grid">
                    <!-- Player's full inventory will be shown here -->
                </div>
            </div>
             <div class="inventory-section">
                <h3>Hotbar Slots</h3>
                <div id="inventoryHotbarGrid" class="inventory-grid">
                    <!-- Hotbar slots will be duplicated here for rearrangement -->
                </div>
            </div>
            <div id="recipeMenu" class="inventory-section">
                <h3>Recipes</h3>
                <div id="recipeList">
                    <!-- Recipes will be dynamically generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Message Box Overlay -->
    <div id="customMessageBoxOverlay">
        <div id="customMessageBox">
            <p id="messageBoxText"></p>
            <div id="messageBoxButtons">
                <!-- Buttons will be dynamically added here -->
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hotbarSize = 10;
        const mainInventoryRows = 3;
        const mainInventoryCols = 9;
        const totalInventorySlots = hotbarSize + (mainInventoryRows * mainInventoryCols); // 10 + 27 = 37 slots
        const maxStackSize = 64; // Max stack size for non-tool items

        const hotbarDiv = document.getElementById('hotbar');
        const loadingScreen = document.getElementById('loadingScreen');
        const coordsDisplay = document.getElementById('coordsDisplay');
        
        // Save Menu
        const saveMenuOverlay = document.getElementById('saveMenuOverlay');
        const saveMenu = document.getElementById('saveMenu'); // Added for scrolling
        const seedInput = document.getElementById('seedInput');
        const newGameButton = document.getElementById('newGameButton');
        const resumeButton = document.getElementById('resumeButton');
        const maintainDurabilityCheckbox = document.getElementById('maintainDurabilityCheckbox');
        const importFileInput = document.getElementById('importFileInput');
        const loadFromFileButton = document.getElementById('loadFromFileButton'); // Renamed from importButton
        const exportCurrentGameButton = document.getElementById('exportCurrentGameButton'); // Renamed from exportButton

        // Inventory/Crafting Menu
        const inventoryCraftingOverlay = document.getElementById('inventoryCraftingOverlay');
        const playerInventoryGrid = document.getElementById('playerInventoryGrid');
        const inventoryHotbarGrid = document.getElementById('inventoryHotbarGrid');
        const craftingGridDiv = document.getElementById('craftingGrid'); // Reference to the 4x4 crafting grid container
        const craftingOutputSlot = document.getElementById('craftingOutput');
        const craftButton = document.getElementById('craftButton');
        const recipeListDiv = document.getElementById('recipeList'); // New: Recipe list container

        // Custom Message Box elements
        const customMessageBoxOverlay = document.getElementById('customMessageBoxOverlay');
        const messageBoxText = document.getElementById('messageBoxText');
        const messageBoxButtons = document.getElementById('messageBoxButtons');

        let heldItem = null; // Stores the item object being dragged by the cursor {type, count, durability}
        let heldItemSourceSlotIndex = -1; // Index in inventorySlots from where the item was picked up

        const tileSize = 40;
        const playerHeightBlocks = 3;
        const playerWidthBlocks = 1;
        const playerHeight = playerHeightBlocks * tileSize;
        const playerWidth = playerWidthBlocks * tileSize;

        // World generation parameters
        const baseSurfaceLevel = 15;
        const minSurfaceVariation = 0;
        const maxSurfaceVariation = 2;
        const surfaceLevelRange = maxSurfaceVariation - minSurfaceVariation + 1;
        const dirtLayerDepth = 6;
        const stoneLayerDepth = 18;
        const compactingStoneLayerDepth = 1;
        const soilPatchProbability = 0.0005; // Not currently used in generation, but kept for reference
        const soilPatchDepth = 10; // Not currently used in generation, but kept for reference
        const soilInfluenceRadius = 6; // Not currently used in generation, but kept for reference
        const soilVeinProbability = 0.02;
        const coalVeinProbability = 0.01;
        const copperVeinProbability = 0.005;
        const treeProbability = 0.08;
        const grassProbability = 0.4;
        const tallGrassProbability = 0.1;

        const columnSurfaceHeights = {};
        const soilPatchCenters = []; // Not currently used in generation, but kept for reference
        const maxSoilPatchCenters = 50; // Not currently used in generation, but kept for reference
        const worldBlocks = {}; // Stores block data for generated and modified blocks

        // --- Seeded PRNG Implementation ---
        // A simple Mulberry32 pseudo-random number generator for consistent world generation.
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // Simple string hashing function to convert text seeds to numbers
        function stringToHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0; // Convert to 32bit integer
            }
            return Math.abs(hash); // Ensure positive hash
        }

        let currentSeed = Date.now(); // Default seed
        let random = mulberry32(currentSeed); // Initialize PRNG

        // Sets the seed for the PRNG
        function setSeed(seed) {
            currentSeed = seed;
            random = mulberry32(seed);
        }

        // Block types and their properties (imgSrc, solid, mining hardness, drop, color - for fallback)
        const blockTypes = {
            'sky': { imgSrc: null, solid: false, miningHardness: 0, drop: null, color: '#87ceeb' },
            'grass_dirt': { imgSrc: 'Grass Dirt Block.png', solid: true, miningHardness: 60, drop: 'dirt', color: '#8B4513' },
            'dirt': { imgSrc: 'Dirt Block.png', solid: true, miningHardness: 50, drop: 'dirt', color: '#A0522D' },
            'stone': { imgSrc: 'Stone Block.png', solid: true, miningHardness: 500, drop: 'stone', color: '#808080' },
            'compacting_stone': { imgSrc: 'Compacting Stone Block.png', solid: true, miningHardness: 750, drop: 'compacted_stone', color: '#696969' },
            'compacted_stone': { imgSrc: 'Compacted Stone Block.png', solid: true, miningHardness: 1000, drop: 'compacted_stone', color: '#708090' },
            'grass_soil': { imgSrc: 'Grass Soil Block.png', solid: true, miningHardness: 80, drop: 'soil', color: '#90EE90' },
            'soil': { imgSrc: 'Soil Block.png', solid: true, miningHardness: 70, drop: 'soil', color: '#A0522D' },
            'coal_stone': { imgSrc: 'Coal Stone Block.png', solid: true, miningHardness: 750, drop: 'coal', color: '#36454F' },
            'copper_compacted_stone': { imgSrc: 'Copper Compacted Stone Block.png', solid: true, miningHardness: 1500, drop: 'copper_ore', color: '#B87333' },
            // Oak Blocks
            'raw_oak': { imgSrc: 'Raw Oak Block.png', solid: true, miningHardness: 150, drop: 'raw_oak', color: '#654321' },
            'oak_bush': { imgSrc: 'Oak Bush Block.png', solid: false, miningHardness: 20, drop: null, color: '#228B22' }, // Oak bush is now not solid
            'planked_oak': { imgSrc: 'Planked Oak Block.png', solid: true, miningHardness: 150, drop: 'planked_oak', color: '#D2B48C' },
            // Birch Blocks
            'raw_birch': { imgSrc: 'Raw Birch Block.png', solid: true, miningHardness: 150, drop: 'raw_birch', color: '#C0C0C0' },
            'birch_bush': { imgSrc: 'Birch Bush Block.png', solid: false, miningHardness: 20, drop: null, color: '#6B8E23' }, // Birch bush is now not solid
            'planked_birch': { imgSrc: 'Planked Birch Block.png', solid: true, miningHardness: 150, drop: 'planked_birch', color: '#F5DEB3' },
            // Spruce Blocks
            'raw_spruce': { imgSrc: 'Raw Spruce Block.png', solid: true, miningHardness: 150, drop: 'raw_spruce', color: '#4A3B2F' },
            'spruce_bush': { imgSrc: 'Spruce Bush Block.png', solid: false, miningHardness: 20, drop: null, color: '#0A4A2A' }, // Spruce bush is now not solid
            'planked_spruce': { imgSrc: 'Planked Spruce Block.png', solid: true, miningHardness: 150, drop: 'planked_spruce', color: '#8B4513' },
            // New Blocks: Grass, Tall Grass, Planted Seeds, Wheat
            'grass': { imgSrc: 'Grass.png', solid: false, miningHardness: 10, drop: 'seeds', dropChance: 0.2, color: '#7CFC00' },
            'tall_grass': { imgSrc: 'Tall Grass.png', solid: false, miningHardness: 20, drop: 'seeds', dropChance: 0.3, color: '#6B8E23' },
            'planted_seeds': { imgSrc: null, solid: false, miningHardness: 100, drop: null, color: '#D2B48C' }, // Planted seeds are not solid, but the block underneath is
            'wheat': { imgSrc: 'Wheat.png', solid: false, miningHardness: 10, drop: 'wheat_item', color: '#F5DEB3' },
            // These are pseudo-blocks for mining planted_seeds, they represent the block underneath
            'seed_dirt_block': { imgSrc: 'Dirt Block.png', solid: true, miningHardness: 100, drop: ['dirt', 'seeds'], color: '#A0522D' },
            'seed_soil_block': { imgSrc: 'Soil Block.png', solid: true, miningHardness: 140, drop: ['soil', 'seeds'], color: '#A0522D' }
        };

        // Item types and their properties (imgSrc, isTool, miningPower, maxDurability, color - for fallback)
        const itemTypes = {
             'coal': { imgSrc: 'Coal Nugget.png', color: '#36454F' },
             'copper_ore': { imgSrc: 'Copper Nugget.png', color: '#B87333' },
             'seeds': { imgSrc: 'Seeds.png', color: '#8B4513' },
             'wheat_item': { imgSrc: 'Wheat.png', color: '#F5DEB3' },
             'wooden_stick': { imgSrc: 'Wooden Stick.png', color: '#8B4513' },
             'wooden_pickaxe': { imgSrc: 'Wooden Pickaxe.png', color: '#A0522D', isTool: true, miningPower: 0.3, maxDurability: 20000 }, // Updated values
             'copper_pickaxe': { imgSrc: 'Copper Pickaxe.png', color: '#B87333', isTool: true, miningPower: 0.5, maxDurability: 35000 } // New item
        };

        // Breaking stage assets for visual feedback during mining
        const breakingStageAssets = {
            'breaking_stage_1': { imgSrc: 'Breaking Stage 1.png' },
            'breaking_stage_2': { imgSrc: 'Breaking Stage 2.png' },
            'breaking_stage_3': { imgSrc: 'Breaking Stage 3.png' }
        };

        // Combine all assets to load
        const assetsToLoadList = { ...blockTypes, ...itemTypes, ...breakingStageAssets };
        const assets = {}; // Stores loaded image objects
        let assetsToLoad = 0;
        let assetsLoaded = 0;
        const failedAssets = {}; // Tracks assets that failed to load

        // Loads all image assets required for the game
        function loadAssets() {
            for (const type in assetsToLoadList) {
                if (assetsToLoadList[type].imgSrc) {
                    assetsToLoad++;
                    const img = new Image();
                    img.onload = () => {
                        assetsLoaded++;
                        assets[type] = img;
                        checkAllAssetsLoaded();
                    };
                    img.onerror = () => {
                        console.error(`Failed to load asset: ${assetsToLoadList[type].imgSrc}`);
                        failedAssets[type] = true; // Mark as failed
                        assetsLoaded++;
                        checkAllAssetsLoaded();
                    };
                    img.src = assetsToLoadList[type].imgSrc;
                }
            }
            // If no assets to load (e.g., all imgSrc are null), proceed directly to init
            if (assetsToLoad === 0) {
                 loadingScreen.style.display = 'none';
                 init();
            }
        }

        // Checks if all assets have finished loading and then initializes the game
        function checkAllAssetsLoaded() {
             if (assetsLoaded === assetsToLoad) {
                 loadingScreen.style.display = 'none';
                 init();
            }
        }

        const player = {
            x: 10 * tileSize, y: 0, dx: 0, dy: 0,
            speed: 5, jumpStrength: -15, onGround: false, gravity: 0.8
        };

        let playerMiningPower = 0.1; // Base mining power
        const camera = { x: 0, y: 0 };
        const keys = {}; // Tracks pressed keys
        const mouse = { x: 0, y: 0, down: false, rightDown: false }; // Tracks mouse state
        let miningTarget = null; // Stores information about the block currently being mined
        
        // Inventory: Array of slots, each slot can be null or an item object {type: string, count: number, durability?: number}
        const inventorySlots = new Array(totalInventorySlots).fill(null);
        // Hotbar: Array of indices into inventorySlots, representing the hotbar items
        const hotbarIndices = new Array(hotbarSize).fill(null);

        let selectedHotbarSlot = 0;
        let isGameActive = true; // True if the browser tab is active
        let isGamePaused = false; // True if a menu is open
        let maintainBlockDurability = false; // Setting for block mining progress persistence

        // Helper to check if a block type is part of a tree structure
        function isTreeBlock(type) {
            return type === 'raw_oak' || type === 'oak_bush' ||
                   type === 'raw_birch' || type === 'birch_bush' ||
                   type === 'raw_spruce' || type === 'spruce_bush';
        }

        // Generates a tree at a given column and surface row
        function generateTree(col, surfaceRow, treeType) {
            let trunkBlockType;
            let bushBlockType;
            let minTrunkHeight;
            let maxTrunkHeight;
            let trunkHeight;
            let minCanopyRadius;
            let maxCanopyRadius;
            let horizontalSpreadFactorMin;
            let horizontalSpreadFactorMax;

            // Define properties based on tree type
            if (treeType === 'oak') {
                trunkBlockType = 'raw_oak';
                bushBlockType = 'oak_bush';
                minTrunkHeight = 4;
                maxTrunkHeight = 6;
                trunkHeight = minTrunkHeight + Math.floor(random() * (maxTrunkHeight - minTrunkHeight + 1));
                minCanopyRadius = 2;
                maxCanopyRadius = 3;
                horizontalSpreadFactorMin = 0.5;
                horizontalSpreadFactorMax = 1.0;
            } else if (treeType === 'birch') {
                trunkBlockType = 'raw_birch';
                bushBlockType = 'birch_bush';
                minTrunkHeight = 5;
                maxTrunkHeight = 8;
                trunkHeight = minTrunkHeight + Math.floor(random() * (maxTrunkHeight - minTrunkHeight + 1));
                minCanopyRadius = 1;
                maxCanopyRadius = 2;
                horizontalSpreadFactorMin = 0.7;
                horizontalSpreadFactorMax = 0.9;
            } else if (treeType === 'spruce') {
                trunkBlockType = 'raw_spruce';
                bushBlockType = 'spruce_bush';
                minTrunkHeight = 6;
                maxTrunkHeight = 10;
                trunkHeight = minTrunkHeight + Math.floor(random() * (maxTrunkHeight - minTrunkHeight + 1));
                // Spruce canopy is more conical, these are base width and height relative to trunk top
                // These values are used to calculate the radius for each layer
                const canopyBaseWidth = 5; // Max width at the bottom of the canopy
                const canopyHeight = trunkHeight + Math.floor(random() * 3); // Total height of canopy
                // Calculate min/max canopy radius for spruce based on its conical shape
                minCanopyRadius = 0;
                maxCanopyRadius = Math.floor(canopyBaseWidth / 2);
            }
            else {
                console.warn("Unknown tree type:", treeType);
                return;
            }

            // Determine trunk base width (oak can sometimes be 2 blocks wide at base)
            const trunkBaseWidth = random() < 0.4 && treeType === 'oak' ? 2 : 1;

            // Generate trunk
            for (let i = 0; i < trunkHeight; i++) {
                const currentTrunkWidth = (i === 0 && trunkBaseWidth === 2) ? 2 : 1;
                for (let w = 0; w < currentTrunkWidth; w++) {
                    const trunkCol = col - Math.floor((currentTrunkWidth - 1) / 2) + w;
                    const key = `${trunkCol},${surfaceRow - 1 - i}`;
                    // Only place trunk if the target block is sky or grass_dirt/soil below surface level
                    // And ensure it doesn't overwrite existing solid blocks above surface
                    if (getBlockType(trunkCol, surfaceRow - 1 - i) === 'sky' || (i === 0 && (getBlockType(trunkCol, surfaceRow) === 'grass_dirt' || getBlockType(trunkCol, surfaceRow) === 'grass_soil'))) {
                        worldBlocks[key] = { type: trunkBlockType, miningProgress: 0 };
                    }
                }
            }

            const topOfTrunkRow = surfaceRow - trunkHeight;

            // Generate canopy
            if (treeType === 'oak' || treeType === 'birch') {
                const canopyRadius = minCanopyRadius + Math.floor(random() * (maxCanopyRadius - minCanopyRadius + 1));

                // Iterate through layers of the canopy
                for (let yOffset = 0; yOffset <= canopyRadius + 2; yOffset++) {
                    let currentLayerRadius = canopyRadius - Math.floor(yOffset / 1.5);
                    currentLayerRadius = Math.max(0, currentLayerRadius);

                    const horizontalSpread = horizontalSpreadFactorMin + random() * (horizontalSpreadFactorMax - horizontalSpreadFactorMin);
                    const effectiveRadius = currentLayerRadius * horizontalSpread;

                    // Place bush blocks in a circular pattern for the current layer
                    for (let x = -Math.ceil(effectiveRadius); x <= Math.ceil(effectiveRadius); x++) {
                        if (random() < 0.85) { // Random chance to place a leaf block
                            const leafCol = col + Math.round(x);
                            const leafRow = topOfTrunkRow - yOffset;

                            const key = `${leafCol},${leafRow}`;
                            // Only place bush if the block is sky and not overwriting trunk
                            if (getBlockType(leafCol, leafRow) === 'sky' && (!worldBlocks[key] || worldBlocks[key].type !== trunkBlockType)) {
                                worldBlocks[key] = { type: bushBlockType, miningProgress: 0 };
                            }
                        }
                    }
                }
                
                // Add branches for oak trees
                if (treeType === 'oak') {
                    const branchCount = Math.floor(random() * 3);
                    for(let i = 0; i < branchCount; i++) {
                        const branchY = topOfTrunkRow + 1 - Math.floor(random() * 3);
                        const branchDir = random() < 0.5 ? -1 : 1;
                        const branchLength = 1 + Math.floor(random() * 2);
                        for(let l = 1; l <= branchLength; l++) {
                            const branchKey = `${col + (l * branchDir)},${branchY}`;
                            if(getBlockType(col + (l * branchDir), branchY) === 'sky') { // Only place branch if sky
                                 worldBlocks[branchKey] = { type: trunkBlockType, miningProgress: 0 };
                            }
                        }
                        // Add leaf clusters at the end of branches
                        const leafClusterRadius = 1 + Math.floor(random() * 1.5);
                        for (let lx = -leafClusterRadius; lx <= leafClusterRadius; lx++) {
                            for (let ly = -leafClusterRadius; ly <= leafClusterRadius; ly++) { // Corrected loop condition
                                if (lx*lx + ly*ly <= leafClusterRadius*leafClusterRadius && random() < 0.9) {
                                    const leafKey = `${col + (branchLength * branchDir) + lx},${branchY - 1 + ly}`;
                                    if(getBlockType(col + (branchLength * branchDir) + lx, branchY - 1 + ly) === 'sky' && (!worldBlocks[leafKey] || worldBlocks[leafKey].type !== trunkBlockType)) {
                                        worldBlocks[leafKey] = { type: bushBlockType, miningProgress: 0 };
                                    }
                                }
                            }
                        }
                    }
                }
            } else if (treeType === 'spruce') {
                // Spruce trees have a conical canopy
                const canopyBottomRow = topOfTrunkRow + Math.floor(trunkHeight * 0.3); // Canopy starts higher on trunk

                for (let r = canopyBottomRow; r >= topOfTrunkRow - 3; r--) { // Iterate upwards from canopy bottom
                    const heightFromCanopyBottom = canopyBottomRow - r;
                    let currentCanopyRadius = Math.max(0, Math.floor(maxCanopyRadius - heightFromCanopyBottom / 1.5)); // Conical shape
                    
                    for (let x = -currentCanopyRadius; x <= currentCanopyRadius; x++) {
                        const leafCol = col + x;
                        const key = `${leafCol},${r}`;
                        if (getBlockType(leafCol, r) === 'sky' && (!worldBlocks[key] || worldBlocks[key].type !== trunkBlockType)) {
                            if (random() < 0.95) {
                                worldBlocks[key] = { type: bushBlockType, miningProgress: 0 };
                            }
                        }
                    }
                }
            }
        }

        // Retrieves block data for a given column and row. Generates if not already present.
        function getBlockData(col, row) {
            const key = `${col},${row}`;
            if (worldBlocks[key] !== undefined) {
                return worldBlocks[key]; // Return existing block data
            }

            let surfaceHeight;
            // Determine surface height for the current column, using neighboring columns for smoother transitions
            if (columnSurfaceHeights[col] !== undefined) {
                surfaceHeight = columnSurfaceHeights[col];
            } else {
                let prevSurface = baseSurfaceLevel + Math.floor(surfaceLevelRange / 2);
                if (columnSurfaceHeights[col - 1] !== undefined) {
                    prevSurface = columnSurfaceHeights[col - 1];
                } else if (columnSurfaceHeights[col + 1] !== undefined) {
                     prevSurface = columnSurfaceHeights[col + 1];
                }
                const offset = Math.floor(random() * 3) - 1; // -1, 0, or 1 for variation
                let potentialHeight = prevSurface + offset;
                surfaceHeight = Math.max(baseSurfaceLevel + minSurfaceVariation, Math.min(baseSurfaceLevel + maxSurfaceVariation, potentialHeight));
                columnSurfaceHeights[col] = surfaceHeight;
            }

            let blockType;
            // Determine block type based on depth relative to surface
            if (row < surfaceHeight) {
                blockType = 'sky';
            } else if (row === surfaceHeight) {
                blockType = 'grass_dirt';
            } else if (row > surfaceHeight && row <= surfaceHeight + dirtLayerDepth) {
                blockType = 'dirt';
            } else if (row > surfaceHeight + dirtLayerDepth && row <= surfaceHeight + dirtLayerDepth + stoneLayerDepth) {
                blockType = 'stone';
            } else if (row > surfaceHeight + dirtLayerDepth + stoneLayerDepth && row <= surfaceHeight + dirtLayerDepth + stoneLayerDepth + compactingStoneLayerDepth) {
                 blockType = 'compacting_stone';
            } else {
                 blockType = 'compacted_stone';
            }

            // Add random veins and patches
            if ((blockType === 'dirt' || blockType === 'grass_dirt') && random() < soilVeinProbability) {
                 if (row === surfaceHeight) blockType = 'grass_soil';
                 else blockType = 'soil';
            }
            if (blockType === 'stone' && random() < coalVeinProbability) {
                 blockType = 'coal_stone';
            }
            if (blockType === 'compacted_stone' && random() < copperVeinProbability) {
                 blockType = 'copper_compacted_stone';
            }

            // --- Grass & Tall Grass Generation ---
            // Only generate if the block is grass_dirt or grass_soil and the block above is sky
            if ((blockType === 'grass_dirt' || blockType === 'grass_soil') && getBlockType(col, row - 1) === 'sky') {
                if (random() < tallGrassProbability) { // Prioritize tall grass
                    worldBlocks[`${col},${row - 1}`] = { type: 'tall_grass', miningProgress: 0 };
                } else if (random() < grassProbability) { // Then normal grass
                    worldBlocks[`${col},${row - 1}`] = { type: 'grass', miningProgress: 0 };
                }
            }

            // --- Tree Generation Call ---
            // A tree can only grow on grass_dirt or grass_soil, and check a random chance
            if ((blockType === 'grass_dirt' || blockType === 'grass_soil') && random() < treeProbability) {
                // Define an area around the potential tree location to check for existing trees
                const checkWidth = 9; // Width of the area to check for existing trees
                const checkHeight = 17; // Height of the area to check for existing trees

                const startCheckCol = col - Math.floor(checkWidth / 2);
                const endCheckCol = col + Math.floor(checkWidth / 2);
                const startCheckRow = surfaceHeight - checkHeight + 1;
                const endCheckRow = surfaceHeight;

                let canPlaceTree = true;

                // Iterate through the check area to see if any tree blocks exist
                for (let c = startCheckCol; c <= endCheckCol; c++) {
                    for (let r = startCheckRow; r <= endCheckRow; r++) {
                        const existingBlockData = worldBlocks[`${c},${r}`];
                        if (existingBlockData && isTreeBlock(existingBlockData.type)) {
                            canPlaceTree = false;
                            break;
                        }
                    }
                    if (!canPlaceTree) break;
                }

                if (canPlaceTree) {
                    const treeTypeRoll = random();
                    let treeTypeToGenerate;
                    if (treeTypeRoll < 0.33) {
                        treeTypeToGenerate = 'oak';
                    } else if (treeTypeRoll < 0.66) {
                        treeTypeToGenerate = 'birch';
                    } else {
                        treeTypeToGenerate = 'spruce';
                    }
                    generateTree(col, row, treeTypeToGenerate);
                }
            }

            const newBlockData = { type: blockType, miningProgress: 0 };
            worldBlocks[key] = newBlockData; // Store the newly generated block
            return newBlockData;
        }

        // Gets only the block type string for a given coordinate
        function getBlockType(col, row) {
            // If the block exists in worldBlocks, return its type. Otherwise, generate and return.
            const blockData = worldBlocks[`${col},${row}`];
            if (blockData) {
                return blockData.type;
            }
            // If not explicitly defined, it's sky by default until generated by getBlockData
            // This is important to prevent infinite recursion when getBlockData calls getBlockType
            return 'sky';
        }

        // Checks if a block at a given coordinate is solid
        function isSolid(col, row) {
            const blockData = getBlockData(col, row); // blockData is an object like { type: 'dirt', miningProgress: 0 }
            // Access the 'type' property of the blockData object to get the block type string
            // Then use this string to look up the 'solid' property in the blockTypes definition.
            return blockTypes[blockData.type] && blockTypes[blockData.type].solid;
        }

        // Converts world coordinates (pixels) to grid coordinates (columns/rows)
        function worldToGrid(x, y) {
            return { col: Math.floor(x / tileSize), row: Math.floor(y / tileSize) };
        }

        // Converts grid coordinates to world coordinates
        function gridToWorld(col, row) {
            return { x: col * tileSize, y: row * tileSize };
        }

        // Checks for intersection between two rectangles
        function rectIntersects(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
        }

        // Updates player position and handles collisions
        function updatePlayer(dt) {
            const factor = isGameActive ? dt / 1000 * 60 : 0; // Delta time factor for frame-rate independence
            player.dy += player.gravity * factor; // Apply gravity

            // Update horizontal movement based on key presses
            if (keys['ArrowLeft']) player.dx = -player.speed;
            else if (keys['ArrowRight']) player.dx = player.speed;
            else player.dx = 0;

            let nextPlayerX = player.x + player.dx * factor;
            let nextPlayerY = player.y + player.dy * factor;

            // Vertical collision detection
            const playerRectY = { x: player.x, y: nextPlayerY, width: playerWidth, height: playerHeight };
            // Calculate relevant block rows/columns to check for collision
            const startRowY = Math.floor(Math.min(player.y, nextPlayerY) / tileSize) - 2; // Check a bit wider range
            const endRowY = Math.ceil(Math.max(player.y + playerHeight, nextPlayerY + playerHeight) / tileSize) + 2;
            const startColY = Math.floor(player.x / tileSize);
            const endColY = Math.floor((player.x + playerWidth - 1) / tileSize);

            player.onGround = false;
            for (let col = startColY; col <= endColY; col++) {
                for (let row = startRowY; row <= endRowY; row++) {
                    if (isSolid(col, row)) {
                        const blockRect = { x: col * tileSize, y: row * tileSize, width: tileSize, height: tileSize };
                        if (rectIntersects(playerRectY, blockRect)) {
                            if (player.dy > 0) { // Falling down, hit ground
                                player.y = blockRect.y - playerHeight;
                                player.dy = 0;
                                player.onGround = true;
                            } else if (player.dy < 0) { // Jumping up, hit ceiling
                                player.y = blockRect.y + tileSize;
                                player.dy = 0;
                            }
                            nextPlayerY = player.y; // Adjust nextPlayerY to new collision-resolved position
                        }
                    }
                }
            }
            player.y = nextPlayerY; // Apply final vertical position

            // Horizontal collision detection
            const playerRectX = { x: nextPlayerX, y: player.y, width: playerWidth, height: playerHeight };
            const startColX = Math.floor(Math.min(player.x, nextPlayerX) / tileSize) - 2; // Check a bit wider range
            const endColX = Math.ceil(Math.max(player.x + playerWidth, nextPlayerX + playerWidth) / tileSize) + 2;
            const startRowX = Math.floor(player.y / tileSize);
            const endRowX = Math.floor((player.y + playerHeight - 1) / tileSize);

            for (let col = startColX; col <= endColX; col++) {
                for (let row = startRowX; row <= endRowX; row++) {
                    if (isSolid(col, row)) {
                        const blockRect = { x: col * tileSize, y: row * tileSize, width: tileSize, height: tileSize };
                        if (rectIntersects(playerRectX, blockRect)) {
                            if (player.dx > 0) nextPlayerX = blockRect.x - playerWidth; // Moving right, hit left side of block
                            else if (player.dx < 0) nextPlayerX = blockRect.x + tileSize; // Moving left, hit right side of block
                            player.dx = 0; // Stop horizontal movement
                        }
                    }
                }
            }
            player.x = nextPlayerX; // Apply final horizontal position

            // Jump logic
            if (keys['ArrowUp'] && player.onGround) {
                player.dy = player.jumpStrength;
                player.onGround = false;
            }
        }

        // Updates the camera position to follow the player
        function updateCamera() {
            camera.x = player.x + playerWidth / 2 - canvas.width / 2;
            camera.y = player.y + playerHeight / 2 - canvas.height / 2;
        }

        // Handles block mining progress and breaking
        function updateMining(dt) {
            if (!isGameActive || isGamePaused) return;

            const worldMouseX = mouse.x + camera.x;
            const worldMouseY = mouse.y + camera.y;
            const targetCol = Math.floor(worldMouseX / tileSize);
            const targetRow = Math.floor(worldMouseY / tileSize);
            const targetKey = `${targetCol},${targetRow}`;
            let blockData = worldBlocks[targetKey];
            // If block data doesn't exist, generate it on demand
            if (!blockData) {
                blockData = getBlockData(targetCol, targetRow);
            }

            // Determine the effective block type for mining hardness and drop
            // This handles cases where 'planted_seeds' block needs to be treated as 'seed_dirt_block'/'seed_soil_block' for mining properties
            let effectiveBlockType = blockData.type;
            if (blockData.type === 'planted_seeds') {
                effectiveBlockType = blockData.baseBlockType === 'dirt' ? 'seed_dirt_block' : 'seed_soil_block';
            }
            const blockPropsForMining = blockTypes[effectiveBlockType];

            // Get current mining power, considering equipped tool
            let currentMiningPower = playerMiningPower;
            const equippedItemObject = getSelectedItem(); // Get the actual item object
            const equippedItemProps = equippedItemObject ? itemTypes[equippedItemObject.type] : null;

            if (equippedItemProps && equippedItemProps.isTool) {
                currentMiningPower += equippedItemProps.miningPower;
            }

            // Start new mining target or update existing one
            if (mouse.down && (!miningTarget || miningTarget.col !== targetCol || miningTarget.row !== targetRow)) {
                if (blockData && blockPropsForMining?.miningHardness > 0) { // Only target minable blocks
                    miningTarget = {
                        col: targetCol, row: targetRow,
                        progress: maintainBlockDurability ? (blockData.miningProgress || 0) : 0, // Resume progress if setting is on
                        requiredProgress: blockPropsForMining.miningHardness // Use effective mining hardness
                    };
                } else {
                    miningTarget = null; // No valid block to mine
                }
            }

            // Continue mining if mouse is down and target is valid
            if (mouse.down && miningTarget && miningTarget.col === targetCol && miningTarget.row === targetRow) {
                // If the block somehow became unminable or disappeared, reset mining target
                if (!blockData || blockPropsForMining?.miningHardness === 0) {
                    if (maintainBlockDurability && worldBlocks[targetKey]) worldBlocks[targetKey].miningProgress = 0;
                    miningTarget = null;
                    return;
                }
                miningTarget.progress += dt * currentMiningPower; // Increase mining progress
                if (maintainBlockDurability) worldBlocks[targetKey].miningProgress = miningTarget.progress; // Save progress if setting is on

                // Decrease tool durability if a tool is equipped
                if (equippedItemObject && equippedItemProps?.isTool) {
                    if (equippedItemObject.durability !== undefined) {
                        equippedItemObject.durability -= dt * currentMiningPower; // Durability decreases by mining power per dt
                        if (equippedItemObject.durability <= 0) {
                            // Pickaxe broke, remove it from inventory
                            removeItemFromInventory(hotbarIndices[selectedHotbarSlot], 1); // Remove by slot index
                            // No message box for pickaxe breaking
                            
                            // Reset mining power if the tool was the source of extra power
                            playerMiningPower = 0.1; // Reset to base
                            miningTarget = null; // Stop mining if tool breaks
                            updateHotbar(); // Update hotbar to reflect broken tool
                            return; // Exit early as tool broke
                        }
                    }
                }

                // If mining is complete
                if (miningTarget.progress >= miningTarget.requiredProgress) {
                    // Use the effective block properties for drops
                    const minedBlockProps = blockTypes[effectiveBlockType];
                    worldBlocks[targetKey] = { type: 'sky', miningProgress: 0 }; // Replace with sky block

                    // Handle drops, including multiple drops for seed blocks
                    if (minedBlockProps?.drop) {
                        if (Array.isArray(minedBlockProps.drop)) {
                            minedBlockProps.drop.forEach(item => addToInventory(item));
                        } else {
                            // Add to inventory with a chance for grass/tall_grass seeds
                            if ((effectiveBlockType === 'grass' || effectiveBlockType === 'tall_grass') && minedBlockProps.dropChance && random() < minedBlockProps.dropChance) {
                                addToInventory(minedBlockProps.drop);
                            } else if (effectiveBlockType !== 'grass' && effectiveBlockType !== 'tall_grass') {
                                addToInventory(minedBlockProps.drop);
                            }
                        }
                    }

                    // Break block above if it's grass, tall_grass, or wheat (plants)
                    const blockAboveKey = `${targetCol},${targetRow - 1}`;
                    const blockAboveData = worldBlocks[blockAboveKey];
                    if (blockAboveData && (blockAboveData.type === 'grass' || blockAboveData.type === 'tall_grass' || blockAboveData.type === 'wheat')) {
                        const blockAboveProps = blockTypes[blockAboveData.type];
                        worldBlocks[blockAboveKey] = { type: 'sky', miningProgress: 0 }; // Break the block above
                        if (blockAboveProps?.drop) { // Add its drop to inventory
                            if (Array.isArray(blockAboveProps.drop)) {
                                blockAboveProps.drop.forEach(item => addToInventory(item));
                            } else {
                                // Add to inventory with a chance for grass/tall_grass seeds
                                if ((blockAboveData.type === 'grass' || blockAboveData.type === 'tall_grass') && blockAboveProps.dropChance && random() < blockAboveProps.dropChance) {
                                    addToInventory(blockAboveProps.drop);
                                } else if (blockAboveData.type !== 'grass' && blockAboveData.type !== 'tall_grass') {
                                    addToInventory(blockAboveProps.drop);
                                }
                            }
                        }
                    }

                    miningTarget = null; // Reset mining target
                }
            } else if (!mouse.down && miningTarget) {
                // If mouse is released and not maintaining durability, reset progress
                if (!maintainBlockDurability && worldBlocks[`${miningTarget.col},${miningTarget.row}`]) {
                    worldBlocks[`${miningTarget.col},${miningTarget.row}`].miningProgress = 0;
                }
                miningTarget = null; // Clear mining target
            }
        }

        // Handles block placement when right-clicking
        function handleBlockPlacement() {
            if (!isGameActive || isGamePaused) return;
             if (mouse.rightDown) {
                const worldMouseX = mouse.x + camera.x;
                const worldMouseY = mouse.y + camera.y;
                const targetCol = Math.floor(worldMouseX / tileSize);
                const targetRow = Math.floor(worldMouseY / tileSize);
                const targetKey = `${targetCol},${targetRow}`;

                const selectedItemObject = getSelectedItem(); // Get the actual item object
                const selectedItemType = selectedItemObject ? selectedItemObject.type : null;

                // Check if the selected item is a block type that can be placed
                const selectedItemIsPlaceableBlock = selectedItemType && blockTypes[selectedItemType] && blockTypes[selectedItemType].solid;
                const selectedItemIsSeeds = selectedItemType === 'seeds';

                // Only proceed if an item is selected and available in inventory
                if (selectedItemObject && selectedItemObject.count > 0) {
                    const currentBlockAtTarget = getBlockType(targetCol, targetRow);
                    const blockDataAtTarget = worldBlocks[targetKey] || getBlockData(targetCol, targetRow); // Ensure block data is available

                    const placementRect = { x: targetCol * tileSize, y: targetRow * tileSize, width: tileSize, height: tileSize };
                    const playerRect = { x: player.x, y: player.y, width: playerWidth, height: playerHeight };

                    // Prevent placing blocks on the player's current position
                    if (rectIntersects(placementRect, playerRect)) {
                        mouse.rightDown = false; // Reset right-click state
                        return;
                    }

                    if (selectedItemIsSeeds) {
                        // Seeds can only be planted on 'dirt' or 'soil' blocks
                        if (currentBlockAtTarget === 'dirt' || currentBlockAtTarget === 'soil') {
                            worldBlocks[targetKey] = {
                                type: 'planted_seeds',
                                miningProgress: 0,
                                plantTime: Date.now(), // Record planting time for growth
                                baseBlockType: currentBlockAtTarget // Store the block type it was planted on
                            };
                            removeItemFromInventory(hotbarIndices[selectedHotbarSlot], 1); // Consume one seed by its slot index
                        }
                    } else if (selectedItemIsPlaceableBlock) {
                        // Placeable blocks can replace 'sky' or plant-like blocks
                        if (currentBlockAtTarget === 'sky' || currentBlockAtTarget === 'grass' || currentBlockAtTarget === 'tall_grass' || currentBlockAtTarget === 'wheat' || currentBlockAtTarget === 'oak_bush' || currentBlockAtTarget === 'birch_bush' || currentBlockAtTarget === 'spruce_bush') {
                            // If replacing a plant, handle its drop
                            if (currentBlockAtTarget !== 'sky') {
                                const replacedBlockProps = blockTypes[currentBlockAtTarget];
                                if (replacedBlockProps?.drop) {
                                    if (Array.isArray(replacedBlockProps.drop)) {
                                        replacedBlockProps.drop.forEach(item => addToInventory(item));
                                    } else {
                                        // Add to inventory with a chance for grass/tall_grass seeds
                                        if ((currentBlockAtTarget === 'grass' || currentBlockAtTarget === 'tall_grass') && replacedBlockProps.dropChance && random() < replacedBlockProps.dropChance) {
                                            addToInventory(replacedBlockProps.drop);
                                        } else if (currentBlockAtTarget !== 'grass' && currentBlockAtTarget !== 'tall_grass') {
                                            addToInventory(replacedBlockProps.drop);
                                        }
                                    }
                                }
                            }
                            worldBlocks[targetKey] = { type: selectedItemType, miningProgress: 0 }; // Place the new block
                            removeItemFromInventory(hotbarIndices[selectedHotbarSlot], 1); // Consume one item by its slot index
                        }
                    }
                }
                mouse.rightDown = false; // Reset right-click state after attempt
             }
        }

        // Adds an item to the inventory. Finds a stackable slot or an empty slot.
        function addToInventory(itemType, count = 1, durability = null) {
            // Ensure the item type exists in either blockTypes or itemTypes
            if (!(blockTypes[itemType] || itemTypes[itemType])) {
                console.warn(`Attempted to add unknown item type: ${itemType}`);
                return;
            }

            const itemProps = itemTypes[itemType] || blockTypes[itemType]; // Get item properties

            if (itemProps?.isTool) {
                // For tools, find the first empty slot and place it there
                for (let i = 0; i < totalInventorySlots; i++) {
                    if (inventorySlots[i] === null) {
                        inventorySlots[i] = {
                            type: itemType,
                            count: 1, // Tools are always count 1
                            durability: durability !== null ? durability : itemProps.maxDurability
                        };
                        // If this empty slot is also a hotbar slot, assign its index
                        if (i < hotbarSize && hotbarIndices[i] === null) {
                            hotbarIndices[i] = i;
                        }
                        updateHotbar();
                        if (inventoryCraftingOverlay.style.display === 'flex') updateInventoryMenu();
                        return; // Item added
                    }
                }
                // If no empty slot, item is lost (for now)
                console.warn(`Inventory full, could not add tool: ${itemType}`);
            } else {
                // For regular items, try to stack first
                for (let i = 0; i < totalInventorySlots; i++) {
                    const slot = inventorySlots[i];
                    if (slot && slot.type === itemType && slot.count < maxStackSize) {
                        const amountToAdd = Math.min(count, maxStackSize - slot.count);
                        slot.count += amountToAdd;
                        count -= amountToAdd;
                        if (count === 0) {
                            updateHotbar();
                            if (inventoryCraftingOverlay.style.display === 'flex') updateInventoryMenu();
                            return; // All items added
                        }
                    }
                }

                // If some items remain, find empty slots for new stacks
                while (count > 0) {
                    for (let i = 0; i < totalInventorySlots; i++) {
                        if (inventorySlots[i] === null) {
                            const amountForNewStack = Math.min(count, maxStackSize);
                            inventorySlots[i] = { type: itemType, count: amountForNewStack };
                            count -= amountForNewStack;
                            // If this empty slot is also a hotbar slot, assign its index
                            if (i < hotbarSize && hotbarIndices[i] === null) {
                                hotbarIndices[i] = i;
                            }
                            updateHotbar();
                            if (inventoryCraftingOverlay.style.display === 'flex') updateInventoryMenu();
                            if (count === 0) return; // All items added
                            break; // Break inner loop to find next empty slot for remaining items
                        }
                    }
                    if (count > 0) { // If still items left and no empty slots found in the iteration
                        console.warn(`Inventory full, could not add remaining ${count} of ${itemType}`);
                        break; // Exit while loop
                    }
                }
            }
            updateHotbar(); // Ensure hotbar is updated after any inventory change
            if (inventoryCraftingOverlay.style.display === 'flex') updateInventoryMenu(); // Update inventory menu if open
        }

        // Removes an item from the inventory by its slot index.
        // This is used for consuming items from hotbar or crafting grid.
        function removeItemFromInventory(slotIndex, count = 1) {
            if (slotIndex === null || slotIndex === undefined || inventorySlots[slotIndex] === null) {
                console.warn(`Attempted to remove item from empty or invalid slot: ${slotIndex}`);
                return;
            }

            const itemInSlot = inventorySlots[slotIndex];
            itemInSlot.count -= count;

            if (itemInSlot.count <= 0) {
                inventorySlots[slotIndex] = null; // Clear the slot
                // If this slot was in the hotbar, clear the hotbar reference too
                const hotbarIdx = hotbarIndices.indexOf(slotIndex);
                if (hotbarIdx !== -1) hotbarIndices[hotbarIdx] = null;
            }
            updateHotbar(); // Update hotbar display
            if (inventoryCraftingOverlay.style.display === 'flex') updateInventoryMenu(); // Update inventory menu if open
        }

        // Gets the total count of an item type across all inventory slots
        function getItemCount(itemType) {
            let totalCount = 0;
            for (let i = 0; i < totalInventorySlots; i++) {
                const slot = inventorySlots[i];
                if (slot && slot.type === itemType) {
                    totalCount += slot.count;
                }
            }
            return totalCount;
        }

        // Gets the currently selected item object from the hotbar
        function getSelectedItem() {
            const hotbarSlotIndex = hotbarIndices[selectedHotbarSlot];
            if (hotbarSlotIndex !== null && hotbarSlotIndex !== undefined) {
                return inventorySlots[hotbarSlotIndex];
            }
            return null;
        }

        // Updates the visual display of the hotbar
        function updateHotbar() {
            hotbarDiv.innerHTML = '';
            for (let i = 0; i < hotbarSize; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.classList.add('hotbar-slot');

                slotDiv.dataset.hotbarIndex = i; // Store hotbar index for event handling

                const inventorySlotIndex = hotbarIndices[i];
                const itemObject = (inventorySlotIndex !== null && inventorySlotIndex !== undefined) ? inventorySlots[inventorySlotIndex] : null;

                if (itemObject) {
                    const itemProps = blockTypes[itemObject.type] || itemTypes[itemObject.type];
                    const itemImg = assets[itemObject.type];

                    // Display image or fallback color
                    if (itemImg && !failedAssets[itemObject.type]) {
                        const imgElement = document.createElement('img');
                        imgElement.src = itemImg.src;
                        imgElement.alt = itemObject.type;
                        slotDiv.appendChild(imgElement);
                    } else if (itemProps?.color) {
                        const fallbackDiv = document.createElement('div');
                        fallbackDiv.classList.add('fallback');
                        fallbackDiv.style.backgroundColor = itemProps.color;
                        fallbackDiv.textContent = itemObject.type.substring(0, 3).toUpperCase(); // Show first 3 letters
                        slotDiv.appendChild(fallbackDiv);
                    }
                    const countSpan = document.createElement('span');
                    countSpan.textContent = itemObject.count;
                    slotDiv.appendChild(countSpan);

                    // Add durability bar for tools
                    if (itemProps?.isTool && itemObject.durability !== null && itemObject.durability !== undefined) {
                        const durabilityBar = document.createElement('div');
                        durabilityBar.classList.add('durability-bar');
                        const durabilityFill = document.createElement('div');
                        durabilityFill.classList.add('durability-fill');
                        const durabilityRatio = itemObject.durability / itemProps.maxDurability;
                        durabilityFill.style.width = `${Math.max(0, durabilityRatio * 100)}%`; // Ensure it doesn't go below 0%
                        // Change color based on durability
                        if (durabilityRatio > 0.6) {
                            durabilityFill.style.backgroundColor = '#28a745'; // Green
                        } else if (durabilityRatio > 0.3) {
                            durabilityFill.style.backgroundColor = '#ffc107'; // Yellow
                        } else {
                            durabilityFill.style.backgroundColor = '#dc3545'; // Red
                        }
                        durabilityBar.appendChild(durabilityFill);
                        slotDiv.appendChild(durabilityBar);
                    }
                }
                hotbarDiv.appendChild(slotDiv);
            }

            // Update player mining power based on selected tool
            const selectedToolObject = getSelectedItem();
            const selectedToolProps = selectedToolObject ? itemTypes[selectedToolObject.type] : null;
            if (selectedToolObject && selectedToolProps?.isTool) {
                playerMiningPower = selectedToolProps.miningPower;
            } else {
                playerMiningPower = 0.1; // Base power if no tool or non-tool selected
            }
        }

        // Draws the game world (blocks)
        function drawWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas before drawing
            // Calculate visible columns and rows based on camera position
            const startCol = Math.floor(camera.x / tileSize) - 1;
            const endCol = Math.ceil((camera.x + canvas.width) / tileSize) + 1;
            const startRow = Math.floor(camera.y / tileSize) - 1;
            const endRow = Math.ceil((camera.y + canvas.height) / tileSize) + 1;

            for (let col = startCol; col < endCol; col++) {
                for (let row = startRow; row < endRow; row++) {
                    const blockData = worldBlocks[`${col},${row}`] || getBlockData(col, row); // Get block data (generate if needed)
                    let blockType = blockData.type;
                    let blockProps = blockTypes[blockType];
                    const screenX = col * tileSize - camera.x;
                    const screenY = row * tileSize - camera.y;

                    // Special handling for 'planted_seeds' block display
                    if (blockData.type === 'planted_seeds') {
                        // Display planted_seeds as a 'seed_dirt_block' or 'seed_soil_block' visually
                        if (blockData.baseBlockType === 'dirt') {
                            blockType = 'seed_dirt_block';
                        } else if (blockData.baseBlockType === 'soil') {
                            blockType = 'seed_soil_block';
                        }
                        blockProps = blockTypes[blockType]; // Get properties for the pseudo-block
                    }

                    if (blockType !== 'sky' && blockProps) { // Don't draw sky blocks
                        const blockImg = assets[blockType];
                        if (blockImg && !failedAssets[blockType]) { // Draw image if loaded
                            ctx.drawImage(blockImg, screenX, screenY, tileSize, tileSize);
                        } else if (blockProps.color) { // Fallback to color if image failed or not available
                             ctx.fillStyle = blockProps.color;
                             ctx.fillRect(screenX, screenY, tileSize, tileSize);
                        }
                        // Draw mining progress overlay if applicable
                        if (maintainBlockDurability && blockData.miningProgress > 0) {
                            // Use the effective block's mining hardness for planted_seeds
                            let effectiveMiningHardness = blockTypes[blockData.type].miningHardness;
                            if (blockData.type === 'planted_seeds') {
                                effectiveMiningHardness = blockTypes[blockData.baseBlockType === 'dirt' ? 'seed_dirt_block' : 'seed_soil_block'].miningHardness;
                            }
                            const progressRatio = blockData.miningProgress / effectiveMiningHardness;
                            let overlayImage = null;
                            if (progressRatio >= 0.75) overlayImage = assets['breaking_stage_3'];
                            else if (progressRatio >= 0.50) overlayImage = assets['breaking_stage_2'];
                            else if (progressRatio >= 0.25) overlayImage = assets['breaking_stage_1'];
                            if (overlayImage) ctx.drawImage(overlayImage, screenX, screenY, tileSize, tileSize);
                        }
                    }
                }
            }
        }
